# WardOS — Hyprland configuration (ADR-0007, docs/design-language.md).
#
# The host layer is calm and nearly static: neutral colours, 1 px separators,
# 4–8 px radii, an 8 px grid, no blur, no shadows, no gradients. State colour
# lives in the Ward Shell surfaces, never in the compositor chrome. Keys are in
# keybindings.conf; the palette values are the Ward Dark tokens of
# ../themes/ward-dark.toml (the shell reads the theme file; these are the
# compositor's copies of the two tokens it needs).
#
# Phase 6 installs this as /etc/xdg/hypr/hyprland.conf; a user file under
# ~/.config/hypr overrides it. Until E-10 lands the toolkit, `ward-shell` prints
# its surfaces (see ../shell) and the bar/launcher lines below start it as a
# text dump in the terminal.

source = ./keybindings.conf

# ---------------------------------------------------------------------------
# Programs (SYSTEM section of the command centre, §13)
# ---------------------------------------------------------------------------
$terminal = foot
$browser  = firefox
$shell    = ward-shell

# Ward Shell surfaces. Each is a layer-shell surface after E-10; today each is
# the printed model so the bindings already exercise the same view model.
$launcher = $terminal --app-id ward-launcher -e sh -c '$shell launcher; read -r _'
$session  = $terminal --app-id ward-session  -e sh -c '$shell session; read -r _'
$observer = $terminal --app-id ward-observer -e sh -c 'ward watch'
$settings = $terminal --app-id ward-settings -e sh -c '$shell settings; read -r _'

# ---------------------------------------------------------------------------
# Startup
# ---------------------------------------------------------------------------
# The bar: the Ward Shell's first surface. Zone 0, no privileged access.
exec-once = $shell bar

# ---------------------------------------------------------------------------
# Monitors and input
# ---------------------------------------------------------------------------
monitor = , preferred, auto, 1

input {
    kb_layout = us
    follow_mouse = 1
    repeat_rate = 40
    repeat_delay = 300
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ---------------------------------------------------------------------------
# Surfaces and geometry (§5)
# ---------------------------------------------------------------------------
general {
    # 8 px grid.
    gaps_in = 4
    gaps_out = 8
    # 1 px, low contrast; the accent marks focus (§3: accent = focus, selection).
    border_size = 1
    col.active_border   = rgb(7FA1C3)
    col.inactive_border = rgb(24272B)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    # Radius 4–8 px.
    rounding = 6
    # No glow, no gradients, no blur: the host layer never shouts.
    blur {
        enabled = false
    }
    # Shadows: almost none. The one level allowed (command centre, approvals)
    # is drawn by the shell on its own layer surfaces, not by the compositor.
    shadow {
        enabled = false
    }
    dim_inactive = false
}

# ---------------------------------------------------------------------------
# Motion (§12): 100–150 ms, linear or gentle ease-out, no springs, no bounces.
# Only agent starts, workspace changes, verification begins, approval appears
# and agent finishes animate; the compositor owns exactly one of those, the
# workspace change, plus the appearance of a shell layer (approval surface).
# Everything else is instant. Speed is in deciseconds: 1.2 = 120 ms.
# ---------------------------------------------------------------------------
animations {
    enabled = true
    bezier = wardOut, 0.0, 0.0, 0.2, 1.0
    animation = global, 0
    animation = windows, 0
    animation = windowsIn, 0
    animation = windowsOut, 0
    animation = windowsMove, 0
    animation = fade, 0
    animation = fadeIn, 0
    animation = fadeOut, 0
    animation = border, 0
    animation = borderangle, 0
    animation = workspaces, 1, 1.2, wardOut, slide
    animation = layers, 1, 1.0, wardOut, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # Ground colour (§3) behind everything.
    background_color = rgb(0E0F11)
    # Focus follows the agent's approval surface immediately.
    focus_on_activate = true
    vfr = true
    vrr = 0
}

# ---------------------------------------------------------------------------
# Workspaces (§8): the default layout is editor + agent activity over a
# terminal on one workspace. Named workspaces keep the three layers apart:
# 1 code, 2 agent, 3 browser; 4–9 are free.
# ---------------------------------------------------------------------------
workspace = 1, defaultName:code, persistent:true, default:true
workspace = 2, defaultName:agent, persistent:true
workspace = 3, defaultName:web, persistent:true

# ---------------------------------------------------------------------------
# Window rules. Shell surfaces are layer-shell after E-10; until then they are
# terminal windows with an app-id, floated and sized like the surface they
# stand in for. Approvals (§10) get the single shadow level and focus.
# ---------------------------------------------------------------------------
windowrulev2 = float, class:^(ward-launcher)$
windowrulev2 = size 640 720, class:^(ward-launcher)$
windowrulev2 = center, class:^(ward-launcher)$
windowrulev2 = stayfocused, class:^(ward-launcher)$

windowrulev2 = float, class:^(ward-session)$
windowrulev2 = size 480 400, class:^(ward-session)$
windowrulev2 = move 100%-488 40, class:^(ward-session)$

windowrulev2 = float, class:^(ward-settings)$
windowrulev2 = size 560 520, class:^(ward-settings)$
windowrulev2 = center, class:^(ward-settings)$

windowrulev2 = float, class:^(ward-approval)$
windowrulev2 = size 520 300, class:^(ward-approval)$
windowrulev2 = center, class:^(ward-approval)$
windowrulev2 = stayfocused, class:^(ward-approval)$
windowrulev2 = pin, class:^(ward-approval)$

# The observer is the agent activity panel: a tiled right column on the agent
# workspace, never floating over the editor.
windowrulev2 = workspace 2, class:^(ward-observer)$
windowrulev2 = tile, class:^(ward-observer)$

# Browsers live on the web workspace by default.
windowrulev2 = workspace 3, class:^(firefox|chromium)$

# Layer-shell surfaces of the shell (after E-10): no blur, no dim, no
# animation beyond the one fade above.
layerrule = noanim, ^(ward-bar)$
layerrule = blur, off
