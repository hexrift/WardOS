# WardOS — Hyprland configuration (ADR-0007, ADR-0016, docs/desktop.md, docs/design-language.md).
#
# The host layer is calm and nearly static: neutral colours, 1 px separators, 4–8 px
# radii, an 8 px grid, no blur, no shadows, no gradients. State colour lives in the
# Ward Shell surfaces, never in the compositor chrome. This file only sources, in
# order; each sourced file owns one concern and says why it is the way it is.
#
# Installed as /usr/share/wardos/hypr/hyprland.conf and /etc/xdg/hypr/hyprland.conf;
# wardos-first-run copies the tree to ~/.config/hypr where a user file wins. The theme
# fragment is sourced last so its values (border colours, ground) override the
# defaults of looknfeel.conf: one theme change is one file, and `wardos-theme set`
# re-renders it and runs `hyprctl reload`.
# Syntax is the Hyprland of Fedora 42 (0.4x: `windowrulev2`, `layerrule = rule, namespace`).

source = ./envs.conf
source = ./monitors.conf
source = ./input.conf
source = ./looknfeel.conf
source = ./windows.conf
source = ./autostart.conf
source = ./bindings.conf
source = ~/.config/wardos/theme/current/hyprland.conf
