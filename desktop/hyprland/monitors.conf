# WardOS — monitors.
#
# The default takes every output at its preferred mode, placed automatically, at
# scale 1. `wardos-setup monitors` writes the user's choices to the copy of this file
# in ~/.config/hypr, one line per output; `hyprctl monitors` lists the names.
#
# Examples (name, resolution@refresh, position, scale):
#   monitor = eDP-1, 2560x1600@120, 0x0, 1.6
#   monitor = DP-1, 3840x2160@60, 1600x0, 2
#   monitor = HDMI-A-1, preferred, auto-right, 1
#   monitor = eDP-1, disable                  # lid closed, external display only
# Scales other than 1, 1.25, 1.5 and 2 blur text; prefer those four.

monitor = , preferred, auto, 1
