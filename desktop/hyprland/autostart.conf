# WardOS — what the session starts.
#
# The bar, notifications, idle handling and clipboard history are started here; the
# polkit agent, the on-screen display, the approval listener and the battery monitor
# are systemd user units (desktop/systemd/user) started from here too, so they behave
# the same under `uwsm start hyprland.desktop` (where graphical-session.target starts
# them) and under a plain `Hyprland`. Hyprland exports WAYLAND_DISPLAY to the user
# manager itself; the import-environment line covers builds without systemd support.
# The theme is re-rendered at login (fragments follow the installed renderer) and
# swaybg is started by `wardos-theme set` with the theme's background; the id comes
# from `wardos-theme current`, Ward Dark until a theme is chosen. wardos-first-run
# returns at once after the first login.

exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprpolkitagent.service swayosd.service wardos-approve.service wardos-battery-monitor.timer
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = wardos-theme set "$(wardos-theme current 2>/dev/null || echo ward-dark)"
exec-once = wardos-first-run
