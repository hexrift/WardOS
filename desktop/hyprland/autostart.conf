# WardOS — what the session starts.
#
# The bar, notifications, idle handling and clipboard history are started here; the
# polkit agent, the on-screen display, the approval listener, the shared bar worker
# (#138 item 2) and the battery monitor are systemd user units (desktop/systemd/user)
# started from here too, so they behave the same under `uwsm start hyprland.desktop`
# (where graphical-session.target starts them) and under a plain `Hyprland`. Hyprland
# exports WAYLAND_DISPLAY to the user manager itself; the import-environment line
# covers builds without systemd support. wardos-shell-worker.service is started before
# `waybar` execs, on this same line, so it has as much of a head start on binding its
# socket as this file can give it before the bar's six segment processes ask for it —
# `ward-shell bar --waybar --follow`'s own bounded connect-retry (`relay_from_worker`)
# is what actually closes the remaining race, since even a `systemctl start` that has
# returned only means the unit's process was forked, not that it has bound yet. The
# theme is re-rendered at login (fragments follow the installed renderer) and swaybg is
# started by `wardos-theme set` with the theme's background; the id comes from
# `wardos-theme current`, Ward Dark until a theme is chosen. wardos-first-run returns
# at once after the first login. wardos-hint.service (#99) follows the compositor's
# event socket for the empty-workspace hint; it needs HYPRLAND_INSTANCE_SIGNATURE, which
# the import-environment line above it hands to the user manager first.

exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprpolkitagent.service swayosd.service wardos-approve.service wardos-shell-worker.service wardos-hint.service wardos-battery-monitor.timer
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = wardos-theme set -q "$(wardos-theme current 2>/dev/null || echo ward-dark)"
exec-once = wardos-first-run
