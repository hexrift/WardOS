# WardOS — keyboard, mouse, touchpad.
#
# Fast repeat for a keyboard-first desktop; focus follows the mouse without raising
# or re-tiling anything. Right Alt is the compose key for config/xcompose. The layout
# is `us` until the installer asks; `wardos-setup input` edits the user's copy.

input {
    kb_layout = us
    kb_options = compose:ralt
    follow_mouse = 1
    repeat_rate = 40
    repeat_delay = 300
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        scroll_factor = 0.6
    }
}

# Three-finger horizontal swipe moves between workspaces (Hyprland 0.51+ `gesture`
# keyword; the old gestures:workspace_swipe option is gone).
gesture = 3, horizontal, workspace
