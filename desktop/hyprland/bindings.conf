# WardOS — key bindings (docs/desktop.md §Keys, docs/architecture.md §11, design-language.md).
#
# Keyboard-first. The comment line above each bind is its description: wardos-keys
# parses this file and shows exactly that text, so every bind has one and the section
# headers title the groups. The presentation is deliberately not a cheat-sheet overlay
# copied from any distribution (§15); the command centre lists commands.
#
# Conventions: `bind` fires on press; `bindel` repeats while held and works when the
# screen is locked (volume, brightness); `bindl` works when locked and does not repeat
# (media keys); `bindm` is a mouse drag. Every exec goes through a wardos-* command
# (docs/desktop.md §Commands) or one of the programs desktop/tests/configs.test.sh
# allows, so each key has a menu entry and a test. Super + K is the keys viewer, so
# focus moves with the arrows (and H/J/L); togglesplit is Super + Alt + T.

$mod = SUPER

$terminal = foot
$shell    = ward-shell

# Ward Shell surfaces. Each is a layer-shell surface after E-10; today each is
# the printed model so the bindings already exercise the same view model.
$session  = $terminal --app-id ward-session  -e sh -c '$shell session; read -r _'
$observer = $terminal --app-id ward-observer -e sh -c 'ward watch'
$settings = $terminal --app-id ward-settings -e sh -c '$shell settings; read -r _'
$verify   = $terminal --app-id ward-verify   -e sh -c 'ward verify; read -r _'

# ---------------------------------------------------------------------------
# Ward
# ---------------------------------------------------------------------------
# Command centre
bind = $mod, SPACE, exec, wardos-menu
# Full menu
bind = $mod ALT, SPACE, exec, wardos-menu system
# Session panel
bind = $mod, S, exec, $session
# Agent activity (observer) on or off
bind = $mod, O, exec, pkill -x -f 'ward watch' || $observer
# Verify current project
bind = $mod, V, exec, $verify
# Review permissions
bind = $mod SHIFT, S, exec, $settings
# Stop the agent session
bind = $mod SHIFT, E, exec, ward stop
# Keys viewer
bind = $mod, K, exec, wardos-keys

# ---------------------------------------------------------------------------
# Programs
# ---------------------------------------------------------------------------
# Terminal
bind = $mod, RETURN, exec, $terminal
# Browser
bind = $mod, B, exec, wardos-launch browser
# Files
bind = $mod, E, exec, wardos-launch files
# Editor
bind = $mod, N, exec, wardos-launch editor
# Music
bind = $mod, M, exec, wardos-launch or-focus spotify flatpak run com.spotify.Client
# Messages
bind = $mod, G, exec, wardos-launch or-focus signal flatpak run org.signal.Signal
# Containers
bind = $mod, D, exec, wardos-launch tui podman-tui
# Activity
bind = $mod, T, exec, wardos-launch tui btop
# Passwords
bind = $mod, slash, exec, wardos-launch or-focus 1password flatpak run com.onepassword.OnePassword

# ---------------------------------------------------------------------------
# Capture
# ---------------------------------------------------------------------------
# Screenshot a region
bind = , Print, exec, wardos-capture screenshot region
# Screenshot a window
bind = SHIFT, Print, exec, wardos-capture screenshot window
# Screenshot an output
bind = CTRL, Print, exec, wardos-capture screenshot output
# Screen recording on or off
bind = ALT, Print, exec, wardos-capture record region
# Colour picker
bind = $mod, Print, exec, wardos-capture color

# ---------------------------------------------------------------------------
# Session
# ---------------------------------------------------------------------------
# Lock
bind = $mod, Escape, exec, wardos-power lock
# Power menu
bind = $mod SHIFT, Escape, exec, wardos-power menu
# Exit Hyprland
bind = $mod SHIFT, Q, exit

# ---------------------------------------------------------------------------
# Toggles
# ---------------------------------------------------------------------------
# Night light on or off
bind = $mod CTRL, N, exec, wardos-toggle nightlight
# Idle lock on or off
bind = $mod CTRL, I, exec, wardos-toggle idle
# Bar on or off
bind = $mod CTRL, B, exec, wardos-toggle bar
# Screensaver on or off
bind = $mod CTRL, S, exec, wardos-toggle screensaver
# Notifications on or off
bind = $mod CTRL, D, exec, wardos-toggle notifications

# ---------------------------------------------------------------------------
# Clipboard and text
# ---------------------------------------------------------------------------
# Clipboard history
bind = $mod CTRL, V, exec, cliphist list | wardos-menu-select --prompt Clipboard | cliphist decode | wl-copy
# Emoji
bind = $mod CTRL, E, exec, wardos-menu-select --prompt Emoji < ~/.config/fuzzel/emoji.txt | cut -d ' ' -f 1 | wl-copy

# ---------------------------------------------------------------------------
# Appearance
# ---------------------------------------------------------------------------
# Next theme
bind = $mod SHIFT, T, exec, wardos-theme next
# Next background
bind = $mod SHIFT, B, exec, wardos-theme bg next

# ---------------------------------------------------------------------------
# Workspaces: 1 code (editor), 2 agent (activity + terminal), 3 web; 4–9 free.
# ---------------------------------------------------------------------------
# Coding workspace
bind = $mod, C, workspace, 1
# Agent workspace
bind = $mod, A, workspace, 2
# Workspace 1
bind = $mod, 1, workspace, 1
# Workspace 2
bind = $mod, 2, workspace, 2
# Workspace 3
bind = $mod, 3, workspace, 3
# Workspace 4
bind = $mod, 4, workspace, 4
# Workspace 5
bind = $mod, 5, workspace, 5
# Workspace 6
bind = $mod, 6, workspace, 6
# Workspace 7
bind = $mod, 7, workspace, 7
# Workspace 8
bind = $mod, 8, workspace, 8
# Workspace 9
bind = $mod, 9, workspace, 9
# Move window to workspace 1
bind = $mod SHIFT, 1, movetoworkspace, 1
# Move window to workspace 2
bind = $mod SHIFT, 2, movetoworkspace, 2
# Move window to workspace 3
bind = $mod SHIFT, 3, movetoworkspace, 3
# Move window to workspace 4
bind = $mod SHIFT, 4, movetoworkspace, 4
# Move window to workspace 5
bind = $mod SHIFT, 5, movetoworkspace, 5
# Move window to workspace 6
bind = $mod SHIFT, 6, movetoworkspace, 6
# Move window to workspace 7
bind = $mod SHIFT, 7, movetoworkspace, 7
# Move window to workspace 8
bind = $mod SHIFT, 8, movetoworkspace, 8
# Move window to workspace 9
bind = $mod SHIFT, 9, movetoworkspace, 9
# Previous workspace
bind = $mod, TAB, workspace, previous
# Previous workspace
bind = $mod, bracketleft, workspace, e-1
# Next workspace
bind = $mod, bracketright, workspace, e+1
# Next workspace (scroll)
bind = $mod, mouse_down, workspace, e+1
# Previous workspace (scroll)
bind = $mod, mouse_up, workspace, e-1

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
# Close window
bind = $mod, Q, killactive
# Fullscreen
bind = $mod, F, fullscreen, 1
# Float or tile
bind = $mod SHIFT, F, togglefloating
# Pseudotile
bind = $mod, P, pseudo
# Split direction
bind = $mod ALT, T, togglesplit
# Focus left
bind = $mod, H, movefocus, l
# Focus down
bind = $mod, J, movefocus, d
# Focus right
bind = $mod, L, movefocus, r
# Focus left
bind = $mod, left, movefocus, l
# Focus down
bind = $mod, down, movefocus, d
# Focus up
bind = $mod, up, movefocus, u
# Focus right
bind = $mod, right, movefocus, r
# Move window left
bind = $mod SHIFT, H, movewindow, l
# Move window down
bind = $mod SHIFT, J, movewindow, d
# Move window up
bind = $mod SHIFT, K, movewindow, u
# Move window right
bind = $mod SHIFT, L, movewindow, r
# Move window left
bind = $mod SHIFT, left, movewindow, l
# Move window down
bind = $mod SHIFT, down, movewindow, d
# Move window up
bind = $mod SHIFT, up, movewindow, u
# Move window right
bind = $mod SHIFT, right, movewindow, r
# Shrink width
bind = $mod CTRL, H, resizeactive, -40 0
# Grow width
bind = $mod CTRL, L, resizeactive, 40 0
# Shrink height
bind = $mod CTRL, K, resizeactive, 0 -40
# Grow height
bind = $mod CTRL, J, resizeactive, 0 40
# Shrink width
bind = $mod ALT, left, resizeactive, -40 0
# Grow width
bind = $mod ALT, right, resizeactive, 40 0
# Shrink height
bind = $mod ALT, up, resizeactive, 0 -40
# Grow height
bind = $mod ALT, down, resizeactive, 0 40
# Move window (drag)
bindm = $mod, mouse:272, movewindow
# Resize window (drag)
bindm = $mod, mouse:273, resizewindow

# ---------------------------------------------------------------------------
# Volume, brightness, media (swayosd shows the level; playerctl drives the player)
# ---------------------------------------------------------------------------
# Volume up
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
# Volume down
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
# Mute
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
# Microphone mute
bindl = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
# Brightness up
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
# Brightness down
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
# Play or pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
# Next track
bindl = , XF86AudioNext, exec, playerctl next
# Previous track
bindl = , XF86AudioPrev, exec, playerctl previous
