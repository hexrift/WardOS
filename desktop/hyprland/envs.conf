# WardOS — environment for everything Hyprland starts.
#
# Wayland first everywhere; X11 only as a fallback for GTK (GDK_BACKEND lists both).
# WARDOS=1 lets scripts and TUIs know they run inside the WardOS session.
# XCompose sequences (config/xcompose, installed as ~/.XCompose) are read by GTK's
# built-in simple input method, so GTK_IM_MODULE stays unset on purpose: an input
# framework would replace the compose table.

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = WARDOS,1

env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
