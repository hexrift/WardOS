# WardOS — window and layer rules.
#
# Shell surfaces are layer-shell after E-10; until then they are terminal windows
# with an app-id, floated and sized like the surface they stand in for. Approvals
# (§10) get the single shadow level and focus. Classes the wardos-* commands set:
# `wardos-webapp-<name>` (chromium --app, wardos-launch webapp) and
# `wardos-tui-<name>` (a terminal running a TUI, wardos-launch tui); both are in
# docs/desktop.md §Commands so the rules and the launchers agree.

# --- Ward Shell surfaces ------------------------------------------------------
windowrule = match:class ^(ward-launcher)$, float on
windowrule = match:class ^(ward-launcher)$, size 640 720
windowrule = match:class ^(ward-launcher)$, center on
windowrule = match:class ^(ward-launcher)$, stay_focused on

windowrule = match:class ^(ward-session)$, float on
windowrule = match:class ^(ward-session)$, size 480 400
windowrule = match:class ^(ward-session)$, move 100%-488 40

windowrule = match:class ^(ward-authority)$, float on
windowrule = match:class ^(ward-authority)$, size 560 440
windowrule = match:class ^(ward-authority)$, move 100%-568 40

windowrule = match:class ^(ward-settings)$, float on
windowrule = match:class ^(ward-settings)$, size 560 520
windowrule = match:class ^(ward-settings)$, center on

windowrule = match:class ^(ward-approval)$, float on
windowrule = match:class ^(ward-approval)$, size 520 300
windowrule = match:class ^(ward-approval)$, center on
windowrule = match:class ^(ward-approval)$, stay_focused on
windowrule = match:class ^(ward-approval)$, pin on

windowrule = match:class ^(ward-verify)$, float on
windowrule = match:class ^(ward-verify)$, size 640 480
windowrule = match:class ^(ward-verify)$, center on

# The observer is the agent activity panel: a tiled right column on the agent
# workspace, never floating over the editor.
windowrule = match:class ^(ward-observer)$, workspace 2
windowrule = match:class ^(ward-observer)$, tile on

# --- The welcome terminal (wardos-welcome, app-id wardos-welcome): a floating -----
# 720×560 window, centred, the size of the first-run guide it holds.
windowrule = match:class ^(wardos-welcome)$, float on
windowrule = match:class ^(wardos-welcome)$, size 720 560
windowrule = match:class ^(wardos-welcome)$, center on

# --- Browsers and web apps: the web workspace, tiled ---------------------------
# Chromium is the image's browser; `firefox` is the class of the Flatpak
# (wardos-install app org.mozilla.firefox), which lands on the same workspace.
windowrule = match:class ^(firefox|chromium|chromium-browser|org.chromium.Chromium)$, workspace 3
windowrule = match:class ^(wardos-webapp-.*)$, workspace 3
windowrule = match:class ^(wardos-webapp-.*)$, tile on

# --- Terminal apps: a floating 1000×700 window, centred ------------------------
windowrule = match:class ^(wardos-tui-.*)$, float on
windowrule = match:class ^(wardos-tui-.*)$, size 1000 700
windowrule = match:class ^(wardos-tui-.*)$, center on

# --- Utilities that are dialogs, not workspaces (#99) -------------------------
# satty (screenshot annotation), the audio mixer, the network and Bluetooth editors,
# the portal's screen-share picker, and the terminals wardos-menu and wardos-calibrate
# open for an install, an update, a setup step, About or passwd (`wardos-launch run
# <app-id>`; the app id is the class). Each is a floating window, sized and centred,
# on the workspace it was asked for: a tool clicked in the bar appears where the user
# is, not as a tile that re-arranges the editor, and no dialog rule carries a
# `workspace` effect that would send it elsewhere. A dialog left open when the user
# moves on stays on its workspace (a window belongs to one) and is closed with
# Super + Q there; the hint and the labels say which workspace is which. The mixer
# TUI (wardos-tui-pulsemixer) is covered by the terminal-app rule above.
windowrule = match:class ^(com.gabm.satty|satty)$, float on
windowrule = match:class ^(com.gabm.satty|satty)$, center on
windowrule = match:class ^(org.pulseaudio.pavucontrol|pavucontrol)$, float on
windowrule = match:class ^(org.pulseaudio.pavucontrol|pavucontrol)$, size 800 560
windowrule = match:class ^(org.pulseaudio.pavucontrol|pavucontrol)$, center on
windowrule = match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-hyprland|hyprland-share-picker)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-hyprland|hyprland-share-picker)$, size 800 560
windowrule = match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-hyprland|hyprland-share-picker)$, center on
windowrule = match:class ^(nm-connection-editor|blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor|blueman-manager)$, size 800 560
windowrule = match:class ^(nm-connection-editor|blueman-manager)$, center on
windowrule = match:class ^(wardos-(install|remove|update|setup|about|passwd))$, float on
windowrule = match:class ^(wardos-(install|remove|update|setup|about|passwd))$, size 1000 700
windowrule = match:class ^(wardos-(install|remove|update|setup|about|passwd))$, center on
# Picture-in-picture stays on top, small, out of the tiling.
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:title ^(Picture-in-Picture)$, size 480 270
windowrule = match:title ^(Picture-in-Picture)$, move 100%-488 100%-278

# --- Layer surfaces --------------------------------------------------------------
# Syntax (Hyprland 0.56 legacy config): `layerrule = match:namespace <regex>, <effect> <value>`;
# window rules likewise `windowrule = match:class <regex>, <effect> <value>` (the v2 form is gone).
# No blur, no dim. §12 animates an approval's appearance (mako keeps the 100 ms fade
# of looknfeel.conf); the bar, the launcher and the on-screen display are instant.
layerrule = match:namespace ^(ward-bar)$, no_anim on
layerrule = match:namespace ^(waybar)$, no_anim on
layerrule = match:namespace ^(launcher)$, no_anim on
layerrule = match:namespace ^(swayosd)$, no_anim on
