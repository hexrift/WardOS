# WardOS — window and layer rules.
#
# Shell surfaces are layer-shell after E-10; until then they are terminal windows
# with an app-id, floated and sized like the surface they stand in for. Approvals
# (§10) get the single shadow level and focus. Classes the wardos-* commands set:
# `wardos-webapp-<name>` (chromium --app, wardos-launch webapp) and
# `wardos-tui-<name>` (a terminal running a TUI, wardos-launch tui); both are in
# docs/desktop.md §Commands so the rules and the launchers agree.

# --- Ward Shell surfaces ------------------------------------------------------
windowrulev2 = float, class:^(ward-launcher)$
windowrulev2 = size 640 720, class:^(ward-launcher)$
windowrulev2 = center, class:^(ward-launcher)$
windowrulev2 = stayfocused, class:^(ward-launcher)$

windowrulev2 = float, class:^(ward-session)$
windowrulev2 = size 480 400, class:^(ward-session)$
windowrulev2 = move 100%-488 40, class:^(ward-session)$

windowrulev2 = float, class:^(ward-settings)$
windowrulev2 = size 560 520, class:^(ward-settings)$
windowrulev2 = center, class:^(ward-settings)$

windowrulev2 = float, class:^(ward-approval)$
windowrulev2 = size 520 300, class:^(ward-approval)$
windowrulev2 = center, class:^(ward-approval)$
windowrulev2 = stayfocused, class:^(ward-approval)$
windowrulev2 = pin, class:^(ward-approval)$

windowrulev2 = float, class:^(ward-verify)$
windowrulev2 = size 640 480, class:^(ward-verify)$
windowrulev2 = center, class:^(ward-verify)$

# The observer is the agent activity panel: a tiled right column on the agent
# workspace, never floating over the editor.
windowrulev2 = workspace 2, class:^(ward-observer)$
windowrulev2 = tile, class:^(ward-observer)$

# --- Browsers and web apps: the web workspace, tiled ---------------------------
windowrulev2 = workspace 3, class:^(firefox|chromium|chromium-browser|org.chromium.Chromium)$
windowrulev2 = workspace 3, class:^(wardos-webapp-.*)$
windowrulev2 = tile, class:^(wardos-webapp-.*)$

# --- Terminal apps: a floating 1000×700 window, centred ------------------------
windowrulev2 = float, class:^(wardos-tui-.*)$
windowrulev2 = size 1000 700, class:^(wardos-tui-.*)$
windowrulev2 = center, class:^(wardos-tui-.*)$

# --- Utilities that are dialogs, not workspaces -------------------------------
# satty (screenshot annotation), audio mixers, the portal's screen-share picker.
windowrulev2 = float, class:^(com.gabm.satty|satty)$
windowrulev2 = center, class:^(com.gabm.satty|satty)$
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol|pavucontrol|wardos-tui-pulsemixer)$
windowrulev2 = center, class:^(org.pulseaudio.pavucontrol|pavucontrol)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk|xdg-desktop-portal-hyprland|hyprland-share-picker)$
windowrulev2 = center, class:^(xdg-desktop-portal-gtk|xdg-desktop-portal-hyprland|hyprland-share-picker)$
windowrulev2 = float, class:^(nm-connection-editor|blueman-manager)$
# Picture-in-picture stays on top, small, out of the tiling.
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 480 270, title:^(Picture-in-Picture)$
windowrulev2 = move 100%-488 100%-278, title:^(Picture-in-Picture)$

# --- Layer surfaces --------------------------------------------------------------
# No blur, no dim. §12 animates an approval's appearance (mako keeps the 100 ms fade
# of looknfeel.conf); the bar, the launcher and the on-screen display are instant.
layerrule = noanim, ^(ward-bar)$
layerrule = noanim, waybar
layerrule = noanim, launcher
layerrule = noanim, swayosd
layerrule = blur, off
