# WardOS — key bindings (docs/architecture.md §11, docs/design-language.md).
#
# Keyboard-first. The set is the architecture's default set plus the shell
# surfaces the design language names; the final set is decided at the Phase 6
# gate, with the presentation deliberately not copied from any distribution
# (§15): there is no cheat-sheet overlay, the command centre lists commands.
# Sourced by hyprland.conf, which defines $terminal, $browser, $launcher,
# $session, $observer and $settings.

$mod = SUPER

# ---------------------------------------------------------------------------
# Ward (architecture §11 and design language §6, §8, §13, §14)
# ---------------------------------------------------------------------------
# Command centre (§13): Super + Space. Latency budget: visible < 16 ms.
bind = $mod, SPACE, exec, $launcher
# Session panel (§6): what clicking `CLAUDE ● LIVE` opens.
bind = $mod, S, exec, $session
# Observer (§8): toggle the agent activity panel.
bind = $mod, O, exec, pkill -x -f 'ward watch' || $observer
# Verify current project (architecture §11).
bind = $mod, V, exec, $terminal --app-id ward-verify -e sh -c 'ward verify; read -r _'
# Review permissions (§14).
bind = $mod SHIFT, S, exec, $settings

# ---------------------------------------------------------------------------
# Programs
# ---------------------------------------------------------------------------
bind = $mod, RETURN, exec, $terminal
bind = $mod, B, exec, $browser

# ---------------------------------------------------------------------------
# Workspaces: 1 code (editor), 2 agent (activity + terminal), 3 web; 4–9 free.
# Super + C and Super + A jump to the coding and agent workspaces.
# ---------------------------------------------------------------------------
bind = $mod, C, workspace, 1
bind = $mod, A, workspace, 2
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, TAB, workspace, previous

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 1
bind = $mod SHIFT, F, togglefloating
bind = $mod, P, pseudo
bind = $mod, T, togglesplit
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod CTRL, H, resizeactive, -40 0
bind = $mod CTRL, L, resizeactive, 40 0
bind = $mod CTRL, K, resizeactive, 0 -40
bind = $mod CTRL, J, resizeactive, 0 40
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ---------------------------------------------------------------------------
# Session
# ---------------------------------------------------------------------------
bind = $mod SHIFT, Q, exit
bind = $mod SHIFT, E, exec, ward stop
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
