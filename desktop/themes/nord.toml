# Nord — the Nord palette on the nine Ward tokens (ADR-0016,
# desktop/themes/README.md). Mapping: nord0–nord2 for the surfaces; nord6 and nord4
# for the text pair; nord8 (the primary frost accent), nord14, nord13, nord11.
# Everything but the palette and the terminal cells is Ward Dark's.

[meta]
name = "Nord"
id = "nord"
variant = "dark"
contrast = "standard"
source = "palette, mapped onto design-language.md §3"
origin = "Nord (Arctic Ice Studio)"

[palette]
ground = { value = "#2E3440", role = "Host layer", source = "palette" }
panel = { value = "#3B4252", role = "Surfaces", source = "palette" }
separator = { value = "#434C5E", role = "Separator", source = "palette" }
text = { value = "#ECEFF4", role = "Primary text", source = "palette" }
text_muted = { value = "#D8DEE9", role = "Secondary text", source = "palette" }
accent = { value = "#88C0D0", role = "Active agent, focus, selection", source = "palette" }
verified = { value = "#A3BE8C", role = "Verified, pass", source = "palette" }
restricted = { value = "#EBCB8B", role = "Restricted, ask pending", source = "palette" }
denied = { value = "#BF616A", role = "Denied, failed", source = "palette" }

[tones]
dim = "text_muted"
ink = "text"
accent = "accent"
ok = "verified"
warn = "restricted"
deny = "denied"

# Nearest xterm-256 cells to the palette (Color::nearest_xterm256 in desktop/theme).
[terminal]
dim = 254
ink = 255
accent = 110
ok = 144
warn = 186
deny = 131

[geometry]
radius_px = 6
separator_px = 1
grid_px = 8
shadow_levels = 1

[motion]
transition_ms = 120
easing = "ease-out"
animated = ["agent-start", "workspace-change", "verification-begin", "approval-appear", "agent-finish"]

[typography]
sans = ["Inter", "Geist", "sans-serif"]
mono = ["JetBrains Mono", "Commit Mono", "monospace"]
tabular_numerals = true
