# Everforest Dark — the Everforest palette on the nine Ward tokens (ADR-0016,
# desktop/themes/README.md). Mapping: bg0, bg1, bg3; fg and grey1; blue, green,
# yellow, red. Everything but the palette and the terminal cells is Ward Dark's.

[meta]
name = "Everforest Dark"
id = "everforest-dark"
variant = "dark"
contrast = "standard"
source = "palette, mapped onto design-language.md §3"
origin = "Everforest (sainnhe), dark, medium"

[palette]
ground = { value = "#2D353B", role = "Host layer", source = "palette" }
panel = { value = "#343F44", role = "Surfaces", source = "palette" }
separator = { value = "#475258", role = "Separator", source = "palette" }
text = { value = "#D3C6AA", role = "Primary text", source = "palette" }
text_muted = { value = "#859289", role = "Secondary text", source = "palette" }
accent = { value = "#7FBBB3", role = "Active agent, focus, selection", source = "palette" }
verified = { value = "#A7C080", role = "Verified, pass", source = "palette" }
restricted = { value = "#DBBC7F", role = "Restricted, ask pending", source = "palette" }
denied = { value = "#E67E80", role = "Denied, failed", source = "palette" }

[tones]
dim = "text_muted"
ink = "text"
accent = "accent"
ok = "verified"
warn = "restricted"
deny = "denied"

# Nearest xterm-256 cells to the palette (Color::nearest_xterm256 in desktop/theme).
[terminal]
dim = 245
ink = 187
accent = 109
ok = 144
warn = 180
deny = 174

[geometry]
radius_px = 6
separator_px = 1
grid_px = 8
shadow_levels = 1

[motion]
transition_ms = 120
easing = "ease-out"
animated = ["agent-start", "workspace-change", "verification-begin", "approval-appear", "agent-finish"]

[typography]
sans = ["Inter", "Geist", "sans-serif"]
mono = ["JetBrains Mono", "Commit Mono", "monospace"]
tabular_numerals = true
