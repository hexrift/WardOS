# Catppuccin Mocha — the Catppuccin palette on the nine Ward tokens (ADR-0016,
# desktop/themes/README.md). Mapping: base, surface0, surface1; text and subtext0;
# blue, green, yellow, red. Everything but the palette and the terminal cells is Ward
# Dark's.

[meta]
name = "Catppuccin Mocha"
id = "catppuccin-mocha"
variant = "dark"
contrast = "standard"
source = "palette, mapped onto design-language.md §3"
origin = "Catppuccin, the Mocha flavour"

[palette]
ground = { value = "#1E1E2E", role = "Host layer", source = "palette" }
panel = { value = "#313244", role = "Surfaces", source = "palette" }
separator = { value = "#45475A", role = "Separator", source = "palette" }
text = { value = "#CDD6F4", role = "Primary text", source = "palette" }
text_muted = { value = "#A6ADC8", role = "Secondary text", source = "palette" }
accent = { value = "#89B4FA", role = "Active agent, focus, selection", source = "palette" }
verified = { value = "#A6E3A1", role = "Verified, pass", source = "palette" }
restricted = { value = "#F9E2AF", role = "Restricted, ask pending", source = "palette" }
denied = { value = "#F38BA8", role = "Denied, failed", source = "palette" }

[tones]
dim = "text_muted"
ink = "text"
accent = "accent"
ok = "verified"
warn = "restricted"
deny = "denied"

# Nearest xterm-256 cells to the palette (Color::nearest_xterm256 in desktop/theme).
[terminal]
dim = 146
ink = 189
accent = 111
ok = 151
warn = 223
deny = 211

[geometry]
radius_px = 6
separator_px = 1
grid_px = 8
shadow_levels = 1

[motion]
transition_ms = 120
easing = "ease-out"
animated = ["agent-start", "workspace-change", "verification-begin", "approval-appear", "agent-finish"]

[typography]
sans = ["Inter", "Geist", "sans-serif"]
mono = ["JetBrains Mono", "Commit Mono", "monospace"]
tabular_numerals = true
