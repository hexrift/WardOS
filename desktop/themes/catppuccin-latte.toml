# Catppuccin Latte — the Catppuccin palette on the nine Ward tokens (ADR-0016,
# desktop/themes/README.md). Mapping: base, mantle, surface0; text and subtext0; blue,
# green, yellow, red. Everything but the palette and the terminal cells is Ward
# Light's.

[meta]
name = "Catppuccin Latte"
id = "catppuccin-latte"
variant = "light"
contrast = "standard"
source = "palette, mapped onto design-language.md §3"
origin = "Catppuccin, the Latte flavour"

[palette]
ground = { value = "#EFF1F5", role = "Host layer", source = "palette" }
panel = { value = "#E6E9EF", role = "Surfaces", source = "palette" }
separator = { value = "#CCD0DA", role = "Separator", source = "palette" }
text = { value = "#4C4F69", role = "Primary text", source = "palette" }
text_muted = { value = "#6C6F85", role = "Secondary text", source = "palette" }
accent = { value = "#1E66F5", role = "Active agent, focus, selection", source = "palette" }
verified = { value = "#40A02B", role = "Verified, pass", source = "palette" }
restricted = { value = "#DF8E1D", role = "Restricted, ask pending", source = "palette" }
denied = { value = "#D20F39", role = "Denied, failed", source = "palette" }

[tones]
dim = "text_muted"
ink = "text"
accent = "accent"
ok = "verified"
warn = "restricted"
deny = "denied"

# Nearest xterm-256 cells to the palette (Color::nearest_xterm256 in desktop/theme).
[terminal]
dim = 243
ink = 240
accent = 27
ok = 70
warn = 172
deny = 161

[geometry]
radius_px = 6
separator_px = 1
grid_px = 8
shadow_levels = 1

[motion]
transition_ms = 120
easing = "ease-out"
animated = ["agent-start", "workspace-change", "verification-begin", "approval-appear", "agent-finish"]

[typography]
sans = ["Inter", "Geist", "sans-serif"]
mono = ["JetBrains Mono", "Commit Mono", "monospace"]
tabular_numerals = true
