# Kanagawa Wave — the Kanagawa palette on the nine Ward tokens (ADR-0016,
# desktop/themes/README.md). Mapping: sumiInk3, sumiInk4, sumiInk5; fujiWhite and
# fujiGray; crystalBlue, springGreen, carpYellow, autumnRed. Everything but the
# palette and the terminal cells is Ward Dark's.

[meta]
name = "Kanagawa Wave"
id = "kanagawa-wave"
variant = "dark"
contrast = "standard"
source = "palette, mapped onto design-language.md §3"
origin = "Kanagawa (rebelot), the wave variant"

[palette]
ground = { value = "#1F1F28", role = "Host layer", source = "palette" }
panel = { value = "#2A2A37", role = "Surfaces", source = "palette" }
separator = { value = "#363646", role = "Separator", source = "palette" }
text = { value = "#DCD7BA", role = "Primary text", source = "palette" }
text_muted = { value = "#727169", role = "Secondary text", source = "palette" }
accent = { value = "#7E9CD8", role = "Active agent, focus, selection", source = "palette" }
verified = { value = "#98BB6C", role = "Verified, pass", source = "palette" }
restricted = { value = "#E6C384", role = "Restricted, ask pending", source = "palette" }
denied = { value = "#C34043", role = "Denied, failed", source = "palette" }

[tones]
dim = "text_muted"
ink = "text"
accent = "accent"
ok = "verified"
warn = "restricted"
deny = "denied"

# Nearest xterm-256 cells to the palette (Color::nearest_xterm256 in desktop/theme).
[terminal]
dim = 242
ink = 187
accent = 110
ok = 107
warn = 180
deny = 131

[geometry]
radius_px = 6
separator_px = 1
grid_px = 8
shadow_levels = 1

[motion]
transition_ms = 120
easing = "ease-out"
animated = ["agent-start", "workspace-change", "verification-begin", "approval-appear", "agent-finish"]

[typography]
sans = ["Inter", "Geist", "sans-serif"]
mono = ["JetBrains Mono", "Commit Mono", "monospace"]
tabular_numerals = true
