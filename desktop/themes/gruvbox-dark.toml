# Gruvbox Dark — the Gruvbox palette on the nine Ward tokens (ADR-0016,
# desktop/themes/README.md). Mapping: bg, bg1, bg2; fg and gray; blue, green, yellow,
# red (the bright set). Everything but the palette and the terminal cells is Ward
# Dark's.

[meta]
name = "Gruvbox Dark"
id = "gruvbox-dark"
variant = "dark"
contrast = "standard"
source = "palette, mapped onto design-language.md §3"
origin = "Gruvbox (morhetz), dark, medium contrast"

[palette]
ground = { value = "#282828", role = "Host layer", source = "palette" }
panel = { value = "#3C3836", role = "Surfaces", source = "palette" }
separator = { value = "#504945", role = "Separator", source = "palette" }
text = { value = "#EBDBB2", role = "Primary text", source = "palette" }
text_muted = { value = "#A89984", role = "Secondary text", source = "palette" }
accent = { value = "#83A598", role = "Active agent, focus, selection", source = "palette" }
verified = { value = "#B8BB26", role = "Verified, pass", source = "palette" }
restricted = { value = "#FABD2F", role = "Restricted, ask pending", source = "palette" }
denied = { value = "#FB4934", role = "Denied, failed", source = "palette" }

[tones]
dim = "text_muted"
ink = "text"
accent = "accent"
ok = "verified"
warn = "restricted"
deny = "denied"

# Nearest xterm-256 cells to the palette (Color::nearest_xterm256 in desktop/theme).
[terminal]
dim = 138
ink = 187
accent = 108
ok = 142
warn = 214
deny = 203

[geometry]
radius_px = 6
separator_px = 1
grid_px = 8
shadow_levels = 1

[motion]
transition_ms = 120
easing = "ease-out"
animated = ["agent-start", "workspace-change", "verification-begin", "approval-appear", "agent-finish"]

[typography]
sans = ["Inter", "Geist", "sans-serif"]
mono = ["JetBrains Mono", "Commit Mono", "monospace"]
tabular_numerals = true
