# WardOS — autologin into Hyprland (docs/desktop.md §Parity "Autologin into Hyprland").
#
# Installed as /etc/systemd/system/getty@tty1.service.d/autologin.conf. agetty logs
# the default user `wardos` in on tty1 without a password prompt; the login shell
# then sources /etc/profile.d/wardos.sh, which starts the session with
# `uwsm start hyprland.desktop`. The user is created by the installer
# (image/disk.sh, desktop/install.sh) with that name; an installer that picks another
# name rewrites `--autologin wardos` here. The session is still protected: hyprlock
# locks with the user's password after 5 minutes (config/hypridle) and on Super +
# Escape, and full-disk encryption is at rest (image/disk.sh --luks). Remove this
# drop-in to get the login prompt back.
[Service]
ExecStart=
ExecStart=-/usr/sbin/agetty -o '-p -f -- \\u' --noclear --autologin wardos %I $TERM
