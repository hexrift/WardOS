# WardOS — idle handling. Installed as ~/.config/hypr/hypridle.conf.
#
# Lock at 5 minutes (hyprlock through the session lock, so `loginctl lock-session`
# and the lid do the same thing), screen off at 10, suspend at 30. hypridle has no
# battery condition, so suspend is unconditional; a desktop that must not suspend
# turns idle handling off with `wardos-toggle idle` (which stops hypridle) or edits
# the user's copy. The screensaver (wardos-screensaver) comes at 2.5 minutes and
# returns at once when `wardos-toggle screensaver` has switched it off. Media and
# fullscreen players inhibit through the usual D-Bus idle inhibit.

general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd =
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 150
    on-timeout = wardos-screensaver
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
