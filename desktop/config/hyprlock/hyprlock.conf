# WardOS — lock screen (docs/design-language.md §3, §5, §9, §12; "As built:
# wallpapers, lock screen, bar").
#
# Installed as ~/.config/hypr/hyprlock.conf. The theme's wallpaper under a veil of
# the panel colour (the ground alone before the first render), the clock large and
# thin in the sans face, the date under it in the muted text, one input field on the
# 8 px grid with the accent as its border (the accent is focus, §3), and the WARD
# mark small in the lower left. No blur of a screenshot, nothing animated (§12).
# The nine tokens, the veil, the font, the radius and the wallpaper path come from
# the theme fragment as variables; the fallbacks below are Ward Dark so the lock
# works before the first render.

$ground     = rgb(0E0F11)
$panel      = rgb(16181B)
$separator  = rgb(24272B)
$text       = rgb(D9D9D6)
$text_muted = rgb(8A8D91)
$accent     = rgb(7FA1C3)
$verified   = rgb(6FAE8A)
$restricted = rgb(C9A24A)
$denied     = rgb(C25A5A)
$veil       = rgba(16181BB3)
$font       = Inter
$radius     = 6
$wallpaper  = ~/.config/wardos/theme/current/background.png

source = ~/.config/wardos/theme/current/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    pam:enabled = true
    fingerprint:enabled = true
}

# The wallpaper (the file `background` names: the theme's own, else the one drawn
# from the tokens); the ground when it cannot be read.
background {
    monitor =
    path = $wallpaper
    color = $ground
    blur_passes = 0
}

# The veil: the panel colour at 70 % over the wallpaper, so the clock reads on any
# background. One shape larger than any output, centred; hyprlock clips it.
shape {
    monitor =
    size = 8000, 8000
    color = $veil
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

# The clock: sans, thin, tabular, quiet. The date under it, muted.
label {
    monitor =
    text = cmd[update:1000] echo "<span weight='light'>$(date +%H:%M)</span>"
    color = $text
    font_size = 96
    font_family = $font
    position = 0, 128
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date "+%A %-d %B"
    color = $text_muted
    font_size = 14
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

# The one accent: the border of the input, which is the focused element. Failure
# is the denied colour on the border, without animation (§3: never animated).
input-field {
    monitor =
    size = 320, 40
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $panel
    font_color = $text
    font_family = $font
    check_color = $accent
    fail_color = $denied
    fail_text = $FAIL
    fail_transition = 0
    capslock_color = $restricted
    placeholder_text = password
    hide_input = false
    rounding = $radius
    position = 0, -40
    halign = center
    valign = center
}

# The host mark, small, in the lower left, where the wallpaper carries it too.
label {
    monitor =
    text = <span letter_spacing="1536">WARD</span>
    color = $text_muted
    font_size = 12
    font_family = $font
    position = 64, 64
    halign = left
    valign = bottom
}
