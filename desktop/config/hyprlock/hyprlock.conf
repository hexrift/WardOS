# WardOS — lock screen (docs/design-language.md §3, §5, §9).
#
# Installed as ~/.config/hypr/hyprlock.conf. Calm: the theme's ground, one input
# field on the 8 px grid with a 1 px border, the time in tabular figures, no blur
# of a screenshot, no image unless the theme has a background. The nine tokens come
# from the theme fragment as variables ($ground … $denied, `rgb(RRGGBB)`); the
# fallbacks below are Ward Dark so the lock works before the first render.

$ground     = rgb(0E0F11)
$panel      = rgb(16181B)
$separator  = rgb(24272B)
$text       = rgb(D9D9D6)
$text_muted = rgb(8A8D91)
$accent     = rgb(7FA1C3)
$verified   = rgb(6FAE8A)
$restricted = rgb(C9A24A)
$denied     = rgb(C25A5A)
$font       = Inter

source = ~/.config/wardos/theme/current/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    pam:enabled = true
    fingerprint:enabled = true
}

background {
    monitor =
    color = $ground
    blur_passes = 0
}

# Time: sans, tabular, quiet.
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = $text
    font_size = 64
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date "+%A %-d %B"
    color = $text_muted
    font_size = 14
    font_family = $font
    position = 0, 56
    halign = center
    valign = center
}

# The one accent: the focused input's border. Failure is the denied colour on the
# border, without animation (§3: never animated).
input-field {
    monitor =
    size = 320, 40
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $separator
    inner_color = $panel
    font_color = $text
    check_color = $accent
    fail_color = $denied
    fail_text = <i>$FAIL</i>
    fail_transition = 0
    capslock_color = $restricted
    placeholder_text = password
    hide_input = false
    rounding = 4
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $text_muted
    font_size = 12
    font_family = $font
    position = 0, -96
    halign = center
    valign = center
}
