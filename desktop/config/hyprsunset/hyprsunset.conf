# WardOS — night light. Installed as ~/.config/hypr/hyprsunset.conf.
#
# hyprsunset is started and stopped by `wardos-toggle nightlight`; while it runs it
# follows these profiles: neutral by day, 4000 K from 21:00. The gamma cap keeps
# the ramp from washing out the theme's separators.

max-gamma = 150

profile {
    time = 7:30
    identity = true
}

profile {
    time = 21:00
    temperature = 4000
}
