# WardOS — Chromium flags. Installed as ~/.config/chromium-flags.conf (Fedora's
# chromium wrapper reads it; one flag per line, `#` comments allowed).
#
# Native Wayland with server-side decorations off and GTK 4 so the compose table
# (config/xcompose) and the GTK theme apply. The browser's theme colour is not a
# flag: `wardos-theme set` writes ~/.config/wardos/theme/current/chromium.json
# ({"theme_color","variant"}) and sets it in the default profile and in every web
# app profile under ~/.local/share/wardos/webapps through the Preferences file.

--ozone-platform=wayland
--enable-features=WaylandWindowDecorations
--gtk-version=4
--password-store=basic
