# WardOS — foot, the default terminal (docs/desktop.md §Parity).
#
# Colours and the mono font come from the theme fragment ([colors] and [main] font),
# included at the top so the values below stay the geometry only: 8 px padding on the
# grid, no bell, a thin bar cursor that does not blink (§12: nothing animates that
# does not need to). Ctrl+Shift+C/V copy and paste; Ctrl+Shift+U opens URLs.

include=~/.config/wardos/theme/current/foot.ini

[main]
term=foot
pad=8x8 center
resize-by-cells=no
bold-text-in-bright=no
dpi-aware=no
app-id=foot

[scrollback]
lines=10000
multiplier=3.0

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[cursor]
style=beam
blink=no
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[bell]
urgent=no
notify=no
visual=no

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+r
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
show-urls-launch=Control+Shift+u
