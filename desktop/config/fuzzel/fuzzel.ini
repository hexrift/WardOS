# WardOS — the command centre and every menu (docs/design-language.md §13, §5).
#
# fuzzel draws what ward-shell and wardos-menu feed it (ADR-0016): a calm list, the
# prompt at the top, 1 px border, 6 px radius, no icons in menus, sans face for the
# UI. Colours and the font come from the theme fragment included from [main]. The
# dmenu mode is what wardos-menu-select uses; the app mode (fuzzel with no --dmenu)
# is the Apps entry of the menu.

[main]
include=~/.config/wardos/theme/current/fuzzel.ini
prompt="> "
placeholder=Search anything
lines=12
width=48
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=22
letter-spacing=0
tabs=8
icon-theme=Papirus-Dark
icons-enabled=no
show-actions=no
terminal=foot -e
layer=overlay
exit-on-keyboard-focus-loss=yes
fuzzy=yes
match-mode=fzf
list-executables-in-path=no
dpi-aware=auto
anchor=center
launch-prefix=

[border]
width=1
radius=6

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+g Control+c
next=Down Control+n Control+j
prev=Up Control+p Control+k
execute=Return KP_Enter Control+y
