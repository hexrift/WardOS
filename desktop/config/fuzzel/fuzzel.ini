# WardOS — the command centre and every menu (docs/design-language.md §13, §5).
#
# fuzzel draws what ward-shell and wardos-menu feed it (ADR-0016): the WARD mark as
# the prompt, "Search anything" as the placeholder, a calm list in the sans face,
# no icons in menus. Geometry on the 8 px grid: 28 rows of 24 px under the prompt,
# 8 px of vertical and 16 px of horizontal padding, which is the 640×720 surface
# the ward-launcher window rule reserves (fuzzel sizes in characters: 42 is about
# 640 px at 11 pt). Colours, the font, the border and the radius come from the theme
# fragment included from [main]; the match colour is the accent there. The dmenu
# mode is what wardos-menu-select uses; the app mode (fuzzel with no --dmenu) is the
# Apps entry of the menu.

[main]
# The theme fragment (colours, font, border, radius). It is a per-human RENDERED file:
# wardos-theme writes it on first login and the desktop autostart re-renders it every login,
# so by the time the app-mode command centre opens it always exists. The menus never depend
# on it — wardos-menu-select passes --config only when the file is present ([[ -f ]] guard) —
# and `fuzzel --check-config` in CI renders a stub for it first, so the shipped config is
# proven valid without assuming any particular human's theme has been rendered yet.
include=~/.config/wardos/theme/current/fuzzel.ini
prompt="WARD  "
placeholder=Search anything
lines=28
width=42
horizontal-pad=16
vertical-pad=8
inner-pad=8
line-height=24
letter-spacing=0
tabs=8
icon-theme=Papirus-Dark
icons-enabled=no
show-actions=no
terminal=foot -e
layer=overlay
exit-on-keyboard-focus-loss=yes
# fuzzel 1.9+ dropped the old boolean `fuzzy=`; the current grammar is a single `match-mode`
# (exact | fzf | fuzzy). Fedora 44 ships fuzzel 1.14, where `fuzzy=yes` is an unknown key and
# fails `fuzzel --check-config`.
match-mode=fuzzy
list-executables-in-path=no
dpi-aware=auto
anchor=center

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+g Control+c
next=Down Control+n Control+j
prev=Up Control+p Control+k
execute=Return KP_Enter Control+y
