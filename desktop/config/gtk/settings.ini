# WardOS — GTK 3 and GTK 4 settings. Installed as ~/.config/gtk-3.0/settings.ini and
# ~/.config/gtk-4.0/settings.ini (the same file; both toolkits read these keys).
#
# Dark by default (the four official themes are three dark and one light; wardos-theme
# set flips gtk-application-prefer-dark-theme in the user's copies). adw-gtk3 gives
# GTK 3 apps the libadwaita look, Papirus icons are calm, the cursor is Adwaita to
# match hyprland/envs.conf. The font is the theme's and dynamic: wardos-font writes
# gtk-font-name here; the default is the sans candidate of design-language §4.

[Settings]
gtk-application-prefer-dark-theme=1
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Inter 11
gtk-decoration-layout=:
gtk-enable-animations=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
