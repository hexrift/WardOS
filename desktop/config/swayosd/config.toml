# WardOS — on-screen display for volume and brightness.
#
# There is nothing to style here: swayosd-server is started by the user unit
# desktop/systemd/user/swayosd.service with `--style ~/.config/wardos/theme/current/swayosd.css`,
# the fragment wardos-theme renders (ground, text, accent, 1 px border, 4 px radius,
# no shadow). The keys in hyprland/bindings.conf call swayosd-client. This file only
# sets the behaviour the theme does not own.

[server]
show_percentage = true
max_volume = 100
top_margin = 0.85
