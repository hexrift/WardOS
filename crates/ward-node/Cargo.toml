[package]
name = "ward-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WardOS: local node service and future fleet worker"

[lib]
name = "ward_node"
path = "src/lib.rs"

[[bin]]
name = "ward-node"
path = "src/main.rs"

[dependencies]
blake3 = { workspace = true }
clap = { workspace = true }
nix = { version = "0.30", features = ["fs", "signal", "socket", "user"] }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ward-authority = { path = "../ward-authority", version = "0.18.0" }
ward-events = { path = "../ward-events", version = "0.18.0" }
ward-launch = { path = "../ward-launch", version = "0.18.0" }
ward-node-protocol = { path = "../ward-node-protocol", version = "0.18.0" }
ward-proxy = { path = "../ward-proxy", version = "0.18.0" }
ward-snapshot = { path = "../ward-snapshot", version = "0.18.0" }

[dev-dependencies]
postcard = { workspace = true }
tempfile = { workspace = true }
# `ci::isolation_ready` gates the bwrap-backed tests, as in ward-launch.
ward-sandbox = { path = "../ward-sandbox", version = "0.18.0" }

[lints]
workspace = true
