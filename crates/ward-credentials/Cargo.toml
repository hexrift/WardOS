[package]
name = "ward-credentials"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WardOS: credential providers, lease rules and the Vault/OpenBao backend"

[dependencies]
nix = { version = "0.30", features = ["fs", "user"] }
# TLS to the provider with the `ring` backend the proxy already uses, the host
# trust store for a provider without a configured CA bundle, and every leased
# value and the provider token in zeroed-on-drop buffers.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = "1"

[dev-dependencies]
rcgen = "0.14"
tempfile = { workspace = true }

[lints]
workspace = true
