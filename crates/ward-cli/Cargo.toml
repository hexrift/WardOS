[package]
name = "ward-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WardOS: the `ward` command-line client"

[[bin]]
name = "ward"
path = "src/main.rs"

[dependencies]
ward-daemon = { path = "../ward-daemon", version = "0.18.0" }
ward-bench = { path = "../ward-bench", version = "0.18.0" }
ward-events = { path = "../ward-events", version = "0.18.0" }
ward-policy = { path = "../ward-policy", version = "0.18.0" }
ward-shell-core = { path = "../ward-shell-core", version = "0.18.0" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }
# The prepare/verify end-to-end tests need the sandbox and skip (or, under
# WARD_REQUIRE_ISOLATION, fail) through the same gate as the daemon's own suite.
ward-sandbox = { path = "../ward-sandbox", version = "0.18.0" }

[lints]
workspace = true
