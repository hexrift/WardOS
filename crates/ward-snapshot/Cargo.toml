[package]
name = "ward-snapshot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WardOS: content-addressed Ward Snapshots (manifest, capture, CAS, materialise)"

[dependencies]
blake3 = { version = "1.8.7", features = ["rayon", "mmap"] }
ignore = "0.4.33"
postcard = { version = "1.1.3", features = ["alloc"] }
rayon = "1.12.0"
reflink-copy = "0.1.30"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
walkdir = "2.5.0"

[dev-dependencies]
proptest = "1.11.0"

[lints]
workspace = true
