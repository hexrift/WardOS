[package]
name = "ward-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WardOS: session supervisor — policy, snapshot, sandbox, event log"

[lib]
name = "ward_daemon"
path = "src/lib.rs"

[[bin]]
name = "wardd"
path = "src/main.rs"

[dependencies]
ward-events = { path = "../ward-events", version = "0.3.2" }
ward-policy = { path = "../ward-policy", version = "0.3.2" }
ward-snapshot = { path = "../ward-snapshot", version = "0.3.2" }
ward-sandbox = { path = "../ward-sandbox", version = "0.3.2" }
ward-proxy = { path = "../ward-proxy", version = "0.3.2" }
ward-agent = { path = "../ward-agent", version = "0.3.2" }
blake3 = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
nix = { version = "0.30", features = ["inotify", "poll", "signal"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = { workspace = true }
# Lets the e2e gateway test run its upstream on loopback without TLS.
ward-proxy = { path = "../ward-proxy", version = "0.3.2", features = ["test-loopback"] }

[lints]
workspace = true
