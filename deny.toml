# cargo-deny configuration. Protected by .tamperward.yml (config).
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path deps carry no version; exempt them, still deny external wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
