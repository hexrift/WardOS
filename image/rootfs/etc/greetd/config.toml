# WardOS login — greetd configuration (docs/desktop.md §Login, docs/design-language.md §2
# "HOST layer"). greetd authenticates the real user through PAM, then runs the session as
# that user; the greeter itself runs unprivileged as `greeter`.
#
# greetd runs `wardos-greetd-session`, the marker-gated selector (ADR-0027), as the
# unprivileged `greeter` user. While /var/lib/wardos/provisioned is absent it starts the
# first-boot provisioning UI under `cage`; once the machine is provisioned it starts the
# normal greeter — `cage` (a single-window Wayland kiosk compositor) hosting `gtkgreet`,
# styled to the Ward Dark palette by /etc/greetd/wardos-greeter.css so it is continuous with
# the Plymouth splash before it. On authentication gtkgreet runs /usr/libexec/wardos-session,
# which starts Hyprland under uwsm (so graphical-session.target and the WardOS user services
# come up exactly as a normal login).
#
# Both paths use `cage -s`, which keeps VT switching enabled (Ctrl+Alt+F2…F6 reach a text
# console), so a greeter or session failure can never lock the machine out — the
# belt-and-braces the cage docs recommend.

[terminal]
# greetd owns VT 1, the VT Plymouth hands off to; there is no getty autologin any more.
vt = 1

[default_session]
command = "wardos-greetd-session"
user = "greeter"
