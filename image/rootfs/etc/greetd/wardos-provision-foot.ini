# Minimal foot configuration for the greetd first-boot provisioning terminal.
# This intentionally does not include ~/.config/wardos/theme/current/foot.ini: the
# locked greeter account has no per-user WardOS theme tree on first boot.

[main]
term=foot
pad=12x12 center
resize-by-cells=no
bold-text-in-bright=no
dpi-aware=no
app-id=wardos-provision
font=JetBrains Mono:size=12

[scrollback]
lines=1000

[cursor]
style=beam
blink=no

[mouse]
hide-when-typing=yes

[bell]
urgent=no
notify=no
visual=no
