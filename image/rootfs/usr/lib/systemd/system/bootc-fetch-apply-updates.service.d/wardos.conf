# WardOS: the bootc update timer stages, never reboots (image/README.md "Security
# posture"). bootc's own unit runs `bootc upgrade --apply --quiet`, which reboots into a
# fetched update at once; on a desktop that would end whatever session, agent run or
# verification is under way. This drop-in keeps the timer (1 h after boot, then every
# 8 h with a 2 h jitter, bootc-fetch-apply-updates.timer) and makes the service fetch
# and stage only: the next boot runs the new image, the previous deployment stays for
# `bootc rollback`. `wardos-update` (`bootc upgrade`) is the manual path; `bootc status`
# shows a staged deployment.
[Service]
ExecStart=
ExecStart=/usr/bin/bootc upgrade --quiet
