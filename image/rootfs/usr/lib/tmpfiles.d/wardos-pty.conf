# WardOS first-boot provisioning runs foot as greetd's unprivileged greeter user.
# A terminal emulator must be able to open /dev/ptmx to allocate its child PTY.
# Fedora normally applies this mode through udev; keep the invariant explicit in the
# immutable image so an early-boot ordering/mode drift cannot strand provisioning.
# `z` adjusts mode/ownership and restores the SELinux label when the node exists.
z /dev/ptmx 0666 root tty - -
