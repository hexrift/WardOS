# WardOS first-boot provisioning runs foot as greetd's unprivileged greeter user.
# A terminal emulator must be able to allocate through the active devpts PTY multiplexor.
# On the normal Linux/Fedora layout /dev/ptmx is a symlink to /dev/pts/ptmx. tmpfiles
# must therefore act on the devpts inode itself: a z /dev/ptmx rule may only touch the
# symlink path and leave the target mode unchanged. systemd-tmpfiles-setup-dev runs after
# the API filesystems (including devpts) are mounted and applies this image-owned rule.
# z adjusts mode/ownership and restores the SELinux label on the existing target node.
z /dev/pts/ptmx 0666 root tty - -
