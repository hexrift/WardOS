# WardOS greeter home (docs/desktop.md §Login).
#
# The `greeter` system user (image/rootfs/usr/lib/sysusers.d/wardos-greeter.conf) has its
# home at /var/lib/greeter, but /var is runtime state on bootc and the directory is not
# baked into the image — so systemd-tmpfiles creates it at boot, before greetd starts.
# Without it cage reports "working directory: No such file or directory" and cannot write
# its GLES shader cache under ~/.cache (E-09). 0700, owned by the greeter.
d /var/lib/greeter 0700 greeter greeter - -
d /var/lib/greeter/.cache 0700 greeter greeter - -
