# WardOS first-boot provisioning restage state (ADR-0027).
#
# The keyboard-first provisioning UI (wardos-provision-ui) runs UNPRIVILEGED as the `greeter`
# bootstrap identity under cage. When a chosen keyboard layout differs from the compositor's
# live layout it records the non-secret carry-over here and exits, so the bootstrap session
# (wardos-greetd-session) can relaunch cage under the chosen layout before any password is
# typed. The broker's own runtime dir (/run/wardos, from wardos-provisiond.socket) is root-owned
# 0755, so the greeter cannot write there — this is a SEPARATE, greeter-owned runtime directory
# for that state. 0700 owned by greeter:greeter: only the greeter can write it, and because it
# is a 0700 directory owned by greeter inside root-owned /run, no other user can pre-seed a
# symlink inside it (the stage write is therefore non-symlinkable). systemd-tmpfiles creates it
# early in boot, before greetd starts, so the directory always exists when the UI runs.
# Type Path                  Mode User    Group   Age Argument
d      /run/wardos-provision 0700 greeter greeter -   -
