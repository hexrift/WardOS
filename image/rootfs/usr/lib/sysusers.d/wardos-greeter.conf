# WardOS greeter user for greetd (docs/desktop.md §Login).
#
# greetd runs the unprivileged greeter — cage hosting gtkgreet — as this user; it only
# authenticates the real user, who then owns the graphical session. A system user with no
# login shell; `video` grants DRM access for cage as belt-and-braces alongside the logind
# device ACL. Created by systemd-sysusers early in boot, so it exists before greetd starts.
u greeter - "WardOS greeter" /var/lib/greeter /usr/sbin/nologin
m greeter video
