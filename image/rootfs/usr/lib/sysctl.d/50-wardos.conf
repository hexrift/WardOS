# WardOS host sysctls (shipped in /usr/lib/sysctl.d by the image; see image/README.md).
#
# wardd builds every sandbox from unprivileged user namespaces (ADR-0002, ADR-0013), so
# the host must allow them for ordinary users.
#
# `kernel.unprivileged_userns_clone` is a Debian/Ubuntu kernel patch, not an upstream
# key; Fedora kernels allow unprivileged user namespaces by default and govern them with
# `user.max_user_namespaces` only. The leading `-` tells systemd-sysctl to log, not fail,
# when the key is absent, so this file is correct on both kernel families.
-kernel.unprivileged_userns_clone = 1

# Ubuntu 23.10+ additionally gates unprivileged user namespaces behind AppArmor. Fedora
# uses SELinux and has no such key, so this stays commented; on an Ubuntu development host
# it is what CI flips (see .github/workflows/verify.yml).
# kernel.apparmor_restrict_unprivileged_userns = 0
