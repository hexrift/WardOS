[workspace]
resolver = "2"
members = [
    "crates/ward-events",
    "crates/ward-policy",
    "crates/ward-snapshot",
    "crates/ward-sandbox",
    "crates/ward-agent",
    "crates/ward-daemon",
    "crates/ward-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/hexrift/WardOS"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
