# The whole host image, built for real (docs/desktop.md §Packages, ADR-0016): every
# package of image/packages.txt installed on the pinned fedora-bootc release, the ward binaries compiled
# from this checkout, the desktop tree placed, `bootc container lint` at the end. Kept
# out of verify.yml so the merge authority stays fast: this runs on main and on pull
# requests that touch what the image is made of. Built twice, natively: x86_64 on
# ubuntu-latest and aarch64 on ubuntu-24.04-arm (image/README.md, "aarch64 and Apple
# silicon"); on main both are published per architecture and joined under `latest`.
name: image

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "desktop/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".containerignore"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "image/**"
      - "desktop/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".containerignore"
      - ".dockerignore"
      - ".github/workflows/image.yml"

jobs:
  build:
    name: image build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk (the Fedora layer plus a Rust build need it)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup
          df -h /
      - name: docker build (checkout binaries, not a release tarball)
        run: |
          set -euo pipefail
          docker build -f image/Containerfile \
            --platform linux/amd64 \
            --build-arg WARDOS_SOURCE=builder \
            --build-arg "WARDOS_VERSION=$(git describe --tags --always)" \
            -t wardos:ci .
          # The size a first pull pays for (image/README.md "Size"): bytes, then human.
          docker image inspect --format '{{.Size}}' wardos:ci | tee /dev/stderr | numfmt --to=iec-i --suffix=B
      - name: What the image holds
        run: |
          set -euo pipefail
          docker run --rm wardos:ci bash -c '
            uname -m
            ls -l /usr/bin/ward*
            ls /usr/share/wardos
            cat /usr/lib/systemd/user-preset/90-wardos.preset
            readlink /etc/xdg/hypr
            systemctl is-enabled wardos-firstboot.service wardos-flathub.service
            systemctl is-enabled bootc-fetch-apply-updates.timer firewalld.service
            grep ^DefaultZone /etc/firewalld/firewalld.conf
            ls -l /usr/bin/claude /usr/bin/codex /usr/bin/tamperward
            node --version
            HOME=/tmp claude --version
            HOME=/tmp codex --version
            grep "\"version\"" /usr/lib/wardos/agents/node_modules/tamperward/package.json
            plymouth-set-default-theme
            bootc container lint'
      # The image everyone else uses (image/README.md, "The published image"): a merge
      # to main that built and linted is what gets published, never a pull request.
      # Only the architecture-suffixed tags are pushed from here — never unqualified
      # `latest`/`<sha>` (#149): those name a *two*-architecture image, and this job
      # only ever has one architecture to offer. The manifest job below is the only
      # place that writes `latest`/`<sha>`, and only once it has verified both
      # architectures are actually present, so the shared tag can never be observed
      # pointing at an x86_64-only image, even transiently.
      - name: Publish to ghcr.io (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in latest-x86_64 "${GITHUB_SHA::7}-x86_64"; do
            docker tag wardos:ci "$repo:$tag"
            docker push "$repo:$tag"
          done

  # The same image for aarch64, built natively on an arm64 runner (no emulation: the
  # Rust build and dnf would take hours under qemu). Published as `latest-aarch64` and
  # `<sha>-aarch64`; an Apple-silicon Mac or an arm64 server pulls those, or `latest`
  # once the manifest job has joined the two.
  build-aarch64:
    name: image build (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup
          df -h /
      - name: docker build --platform linux/arm64 (checkout binaries)
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          docker build -f image/Containerfile \
            --platform linux/arm64 \
            --build-arg WARDOS_SOURCE=builder \
            --build-arg "WARDOS_VERSION=$(git describe --tags --always)" \
            -t wardos:ci .
          # The size a first pull pays for (image/README.md "Size"): bytes, then human.
          docker image inspect --format '{{.Size}}' wardos:ci | tee /dev/stderr | numfmt --to=iec-i --suffix=B
      - name: What the image holds
        run: |
          set -euo pipefail
          docker run --rm wardos:ci bash -c '
            uname -m
            ls -l /usr/bin/ward*
            ls /usr/share/wardos
            cat /usr/lib/systemd/user-preset/90-wardos.preset
            readlink /etc/xdg/hypr
            systemctl is-enabled wardos-firstboot.service wardos-flathub.service
            plymouth-set-default-theme
            bootc container lint'
      - name: Publish to ghcr.io (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in latest-aarch64 "${GITHUB_SHA::7}-aarch64"; do
            docker tag wardos:ci "$repo:$tag"
            docker push "$repo:$tag"
          done

  # One `latest` (and one `<sha>`) for both: a manifest list that points at the two
  # per-architecture images, so `bootc switch ghcr.io/hexrift/wardos:latest` and
  # `podman pull` resolve to the right one on either machine. `docker buildx imagetools
  # create` only writes manifests to the registry (no image data moves), which the
  # workflow token's packages:write allows. Runs only when both builds succeeded, and
  # is the *only* job that ever writes unqualified `latest`/`<sha>` (#149) — never
  # x86_64-only, not even transiently. Two more things this job does before and after
  # that promotion, both from #149's "never an intermediate image, never an
  # out-of-order overwrite":
  #  - it inspects the index it just built and fails the job unless both linux/amd64
  #    and linux/arm64 are actually present, instead of trusting `needs:` alone;
  #  - it re-checks main's tip immediately before promoting `latest`, and skips that
  #    step (leaving `latest` alone) if a newer commit has already landed — so a run
  #    for an older commit that happens to finish its builds later can never clobber
  #    a newer commit's already-promoted `latest`. The per-commit `<sha>` tag is still
  #    written either way, so every complete build stays individually addressable.
  # `latest` is promoted from the `<sha>` index by NAME, not rebuilt from the two
  # per-architecture tags: those stay mutable for as long as the registry keeps them,
  # so re-deriving `latest` from them again at promotion time could pick up a
  # different child than the one just validated above. `<sha>` is written exactly
  # once, by the "Build the per-commit two-architecture index" step above, and
  # nothing else in this workflow ever writes it again — so copying it is copying
  # precisely what was inspected, not reconstructing something that might have moved.
  # `concurrency` below serializes this job's own runs so two can't interleave a
  # promotion, but GitHub keeps at most one *pending* run per group (a third queued
  # run replaces the second, it does not queue behind it) — this bounds concurrent
  # writers to one, it does not guarantee every triggering commit gets its own run.
  # The staleness check reads `main`'s tip over git (not the registry), so this job
  # also needs `contents: read` alongside `packages: write` — every other job here
  # that touches repository content already carries it (and now also checks the repo
  # out, to reach the decision logic below at scripts/release/*.sh).
  #
  # Cancellation before promotion (#149's third acceptance case) is safe by
  # construction rather than by test: `latest` is written by exactly one command, the
  # last one below, so a job cancelled at any earlier point -- mid-build, mid-validate,
  # mid-staleness-check -- has touched nothing but its own ephemeral /tmp/index.json.
  manifest:
    name: multi-arch manifest
    needs: [build, build-aarch64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: wardos-image-manifest-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Build the per-commit two-architecture index
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha="${GITHUB_SHA::7}"
          docker buildx imagetools create -t "$repo:$sha" \
            "$repo:$sha-x86_64" "$repo:$sha-aarch64"
          docker buildx imagetools inspect "$repo:$sha" --raw | tee /tmp/index.json

      # scripts/release/check-multiarch-index.test.sh covers one architecture's
      # manifest missing from the index (#149's first acceptance case).
      - name: Validate both architectures are present before promoting
        run: bash scripts/release/check-multiarch-index.sh /tmp/index.json

      - name: Promote latest, unless a newer commit has already landed on main
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head_sha="$(git ls-remote "https://x-access-token:${GHCR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          # scripts/release/check-not-stale.test.sh covers overlapping runs
          # finishing out of order and retrying an already-published commit
          # (#149's second and fourth acceptance cases).
          bash scripts/release/check-not-stale.sh "$GITHUB_SHA" "$head_sha" || exit 0
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha="${GITHUB_SHA::7}"
          # Copy the index by name, not by rebuilding it from the (mutable) per-arch
          # tags again: this is exactly the object the previous two steps built and
          # validated, so promoting it is promoting what was actually checked.
          docker buildx imagetools create -t "$repo:latest" "$repo:$sha"
          docker buildx imagetools inspect "$repo:latest"
