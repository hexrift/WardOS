# The whole host image, built for real (docs/desktop.md §Packages, ADR-0016): every
# package of image/packages.txt installed on the pinned fedora-bootc release, the ward binaries compiled
# from this checkout, the desktop tree placed, `bootc container lint` at the end. Kept
# out of verify.yml so the merge authority stays fast: this runs on main and on pull
# requests that touch what the image is made of. Built twice, natively: x86_64 on
# ubuntu-latest and aarch64 on ubuntu-24.04-arm (image/README.md, "aarch64 and Apple
# silicon"); on main both are published per architecture and joined under `latest`.
name: image

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "desktop/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".containerignore"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "image/**"
      - "desktop/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".containerignore"
      - ".dockerignore"
      - ".github/workflows/image.yml"

jobs:
  # `packages: write` is deliberately NOT granted here (#164 finding 2): `docker build`
  # runs an attacker-influenced Containerfile/build context, including on an internal
  # (non-fork) pull request that touches image/**, and permissions are per-job, not
  # per-step — an `if:`-guarded publish step later in the same job would not stop that
  # build step from running with a live registry token available to it. The image this
  # job produces only exists in its own runner's ephemeral Docker daemon, so it is handed
  # to the publish job below as a saved tarball artifact rather than rebuilt there.
  build:
    name: image build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk (the Fedora layer plus a Rust build need it)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup
          df -h /
      - name: docker build (checkout binaries, not a release tarball)
        run: |
          set -euo pipefail
          docker build -f image/Containerfile \
            --platform linux/amd64 \
            --build-arg WARDOS_SOURCE=builder \
            --build-arg "WARDOS_VERSION=$(git describe --tags --always)" \
            -t wardos:ci .
          # The size a first pull pays for (image/README.md "Size"): bytes, then human.
          docker image inspect --format '{{.Size}}' wardos:ci | tee /dev/stderr | numfmt --to=iec-i --suffix=B
      - name: What the image holds
        run: |
          set -euo pipefail
          docker run --rm wardos:ci bash -c '
            uname -m
            ls -l /usr/bin/ward*
            ls /usr/share/wardos
            cat /usr/lib/systemd/user-preset/90-wardos.preset
            readlink /etc/xdg/hypr
            systemctl is-enabled wardos-firstboot.service wardos-flathub.service
            systemctl is-enabled bootc-fetch-apply-updates.timer firewalld.service
            grep ^DefaultZone /etc/firewalld/firewalld.conf
            ls -l /usr/bin/claude /usr/bin/codex /usr/bin/tamperward
            node --version
            HOME=/tmp claude --version
            HOME=/tmp codex --version
            grep "\"version\"" /usr/lib/wardos/agents/node_modules/tamperward/package.json
            plymouth-set-default-theme
            bootc container lint'
      # Hands the already-built image to the publish job (main only): saved and
      # compressed here, in the no-registry-token job, then loaded and pushed there.
      - name: Save the built image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker save wardos:ci | gzip > /tmp/wardos-x86_64.tar.gz
          du -h /tmp/wardos-x86_64.tar.gz
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: wardos-image-x86_64
          path: /tmp/wardos-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The same image for aarch64, built natively on an arm64 runner (no emulation: the
  # Rust build and dnf would take hours under qemu). See `build` above for why
  # `packages: write` is not granted to this job either.
  build-aarch64:
    name: image build (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup
          df -h /
      - name: docker build --platform linux/arm64 (checkout binaries)
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          docker build -f image/Containerfile \
            --platform linux/arm64 \
            --build-arg WARDOS_SOURCE=builder \
            --build-arg "WARDOS_VERSION=$(git describe --tags --always)" \
            -t wardos:ci .
          # The size a first pull pays for (image/README.md "Size"): bytes, then human.
          docker image inspect --format '{{.Size}}' wardos:ci | tee /dev/stderr | numfmt --to=iec-i --suffix=B
      - name: What the image holds
        run: |
          set -euo pipefail
          docker run --rm wardos:ci bash -c '
            uname -m
            ls -l /usr/bin/ward*
            ls /usr/share/wardos
            cat /usr/lib/systemd/user-preset/90-wardos.preset
            readlink /etc/xdg/hypr
            systemctl is-enabled wardos-firstboot.service wardos-flathub.service
            plymouth-set-default-theme
            bootc container lint'
      - name: Save the built image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker save wardos:ci | gzip > /tmp/wardos-aarch64.tar.gz
          du -h /tmp/wardos-aarch64.tar.gz
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: wardos-image-aarch64
          path: /tmp/wardos-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The image everyone else uses (image/README.md, "The published image"): a merge to
  # main that built and linted is what gets published, never a pull request. Loads the
  # tarball `build` already produced instead of rebuilding, so this is one of only two
  # jobs in the workflow that ever hold a live `packages: write` token (#164 finding 2).
  # Only ever writes its own architecture-suffixed tags (`latest-x86_64`, `<sha>-x86_64`)
  # — never unqualified `latest`/`<sha>` (#149): those name a *two*-architecture image,
  # and this job only ever has one architecture to offer. The `manifest` job below is
  # the only place that writes `latest`/`<sha>`, and only once it has verified both
  # architectures are actually present, so the shared tag can never be observed pointing
  # at an x86_64-only image, even transiently. Also exposes the digest ghcr.io actually
  # assigned this push as a job output, so `manifest` can assemble the two-architecture
  # index from immutable digests instead of these mutable tag names (issue #149's
  # suggested implementation: architecture jobs record their own digest for the manifest
  # job to assemble and validate from).
  publish:
    name: publish to ghcr.io (x86_64)
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wardos-image-x86_64
          path: /tmp
      - name: docker load
        run: gunzip -c /tmp/wardos-x86_64.tar.gz | docker load
      - name: Publish to ghcr.io
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha="${GITHUB_SHA::7}"
          for tag in "latest-x86_64" "$sha-x86_64"; do
            docker tag wardos:ci "$repo:$tag"
            docker push "$repo:$tag"
          done
          digest="$(docker buildx imagetools inspect "$repo:$sha-x86_64" | awk '/^Digest:/{print $2}')"
          [ -n "$digest" ] || { echo "publish: could not read the digest of $repo:$sha-x86_64" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Same as `publish` above, for the aarch64 tarball `build-aarch64` produced.
  publish-aarch64:
    name: publish to ghcr.io (aarch64)
    needs: [build-aarch64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wardos-image-aarch64
          path: /tmp
      - name: docker load
        run: gunzip -c /tmp/wardos-aarch64.tar.gz | docker load
      - name: Publish to ghcr.io
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha="${GITHUB_SHA::7}"
          for tag in "latest-aarch64" "$sha-aarch64"; do
            docker tag wardos:ci "$repo:$tag"
            docker push "$repo:$tag"
          done
          digest="$(docker buildx imagetools inspect "$repo:$sha-aarch64" | awk '/^Digest:/{print $2}')"
          [ -n "$digest" ] || { echo "publish: could not read the digest of $repo:$sha-aarch64" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # One `latest` (and one `<sha>`) for both: a manifest list that points at the two
  # per-architecture images, so `bootc switch ghcr.io/hexrift/wardos:latest` and
  # `podman pull` resolve to the right one on either machine. `docker buildx imagetools
  # create` only writes manifests to the registry (no image data moves), which the
  # workflow token's packages:write allows. Runs only when both publishes succeeded, and
  # is the *only* job that ever writes unqualified `latest`/`<sha>` (#149) — never
  # x86_64-only, not even transiently. Assembles the index from the immutable digests
  # `publish`/`publish-aarch64` captured above, not their (mutable-for-as-long-as-the-
  # registry-keeps-them) tag names — so what gets validated below is guaranteed to be
  # what those jobs actually pushed, unaffected by anything that republishes those tags
  # afterward. Two more things this job does before and after that promotion, both from
  # #149's "never an intermediate image, never an out-of-order overwrite":
  #  - it inspects the index it just built and fails the job unless both linux/amd64
  #    and linux/arm64 are actually present, instead of trusting `needs:` alone;
  #  - it re-checks main's tip immediately before promoting `latest`, and skips that
  #    step (leaving `latest` alone) if a newer commit has already landed — so a run
  #    for an older commit that happens to finish its builds later can never clobber
  #    a newer commit's already-promoted `latest`. The per-commit `<sha>` tag is still
  #    written either way, so every complete build stays individually addressable.
  # `latest` itself is promoted by DIGEST (`repo@sha256:...`, the assembled index's own
  # digest captured right after building it), for the same reason: a retry that reruns
  # `publish`/`publish-aarch64` and republishes their tags (possibly with different
  # bytes, if an upstream input moved) can never make a later promotion pick up a
  # different index than the one this run actually validated.
  # `concurrency` below serializes this job's own runs so two can't interleave a
  # promotion, but GitHub keeps at most one *pending* run per group (a third queued
  # run replaces the second, it does not queue behind it) — this bounds concurrent
  # writers to one, it does not guarantee every triggering commit gets its own run.
  # The staleness check reads `main`'s tip over git (not the registry), so this job
  # needs `contents: read` alongside `packages: write`, and checks the repo out to
  # reach the decision logic at scripts/release/*.sh.
  manifest:
    name: multi-arch manifest
    needs: [publish, publish-aarch64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: wardos-image-manifest-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the per-commit two-architecture index from immutable child digests
        id: build_index
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X86_64_DIGEST: ${{ needs.publish.outputs.digest }}
          AARCH64_DIGEST: ${{ needs.publish-aarch64.outputs.digest }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha="${GITHUB_SHA::7}"
          docker buildx imagetools create -t "$repo:$sha" \
            "$repo@$X86_64_DIGEST" "$repo@$AARCH64_DIGEST"
          docker buildx imagetools inspect "$repo:$sha" --raw | tee /tmp/index.json
          # Captured now, right after the index is built, so promotion later can target
          # exactly this content by digest instead of whatever `<sha>` resolves to by then.
          digest="$(docker buildx imagetools inspect "$repo:$sha" | awk '/^Digest:/{print $2}')"
          [ -n "$digest" ] || { echo "build_index: could not read the digest of $repo:$sha" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # scripts/release/check-multiarch-index.test.sh covers one architecture's
      # manifest missing from the index (#149's first acceptance case).
      - name: Validate both architectures are present before promoting
        id: validate
        run: bash scripts/release/check-multiarch-index.sh /tmp/index.json

      # scripts/release/promote-latest.test.sh covers: staying-current promotes exactly
      # the digest captured above and nothing else; a run superseded by a newer commit
      # (out-of-order completion, #149's second acceptance case) never invokes docker at
      # all; a run interrupted strictly before the write also never invokes docker
      # (#149's cancellation acceptance case); and a retry re-promotes whatever digest
      # it is given, faithfully.
      - name: Promote latest, unless a newer commit has already landed on main
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          head_sha="$(git ls-remote "https://x-access-token:${GHCR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          bash scripts/release/promote-latest.sh "$repo" "${{ steps.build_index.outputs.digest }}" "$GITHUB_SHA" "$head_sha"

      # #149's suggested implementation asks for the promoted index digest, its
      # children, the source commit and the validation result to be recorded
      # alongside the release; the job summary is that record; signing/provenance
      # proper (attesting to it) is #148.
      - name: Record promotion provenance in the job summary
        if: always()
        env:
          X86_64_DIGEST: ${{ needs.publish.outputs.digest }}
          AARCH64_DIGEST: ${{ needs.publish-aarch64.outputs.digest }}
        run: |
          {
            echo "### Image promotion for \`${GITHUB_SHA::7}\`"
            echo "- source commit: \`$GITHUB_SHA\`"
            echo "- index digest: \`${{ steps.build_index.outputs.digest }}\`"
            echo "- x86_64 child digest: \`$X86_64_DIGEST\`"
            echo "- aarch64 child digest: \`$AARCH64_DIGEST\`"
            echo "- platform validation: \`${{ steps.validate.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
