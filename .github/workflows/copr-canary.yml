# Not protected by .tamperward.yml as a merge-authority gate the way verify.yml is —
# this workflow never runs against a pull request and decides nothing about whether one
# merges. It exists to answer, on its own clock, "are the image's COPRs (image/coprs.txt)
# currently resolvable" so a PR's "image packages"/"hyprland config" failure can be
# checked against a signal that already exists, instead of every PR re-deriving "is this
# my diff or an upstream outage" from raw dnf logs — issue #198 item 3, the piece #201's
# retry/classification fix explicitly did not cover (a COPR that enables cleanly but no
# longer publishes a package is not a transient error `retry` can ride out; see #198's
# 2026-09-22 18:53 UTC recurrence for exactly that shape).
name: copr canary

on:
  schedule:
    # Every 3 hours, off the hour: an independent, standing health signal for the COPRs
    # image/coprs.txt enables, not gated behind any PR landing.
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: copr canary (packages + hyprland config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same two scripts "image packages"/"hyprland config" run in verify.yml,
      # run here unpaired from any diff — a failure here can only mean the COPRs
      # themselves changed, never that a pull request broke something.
      - name: image packages
        run: bash image/check-packages.sh
      - name: hyprland config
        if: always()
        run: bash image/check-hyprland.sh
      - name: Summary
        if: always()
        run: |
          {
            echo "### copr canary"
            echo
            if [[ "${{ job.status }}" == "success" ]]; then
              echo "Both COPRs in \`image/coprs.txt\` resolved cleanly as of this run."
            else
              echo "At least one check failed against the COPRs alone, no pull request diff involved."
              echo "A PR whose \"image packages\"/\"hyprland config\" job fails at roughly this time is very"
              echo "likely hitting the same upstream gap, not something in its own diff — see the failing"
              echo "step above for which COPR/package, and [issue #198](https://github.com/hexrift/WardOS/issues/198)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
