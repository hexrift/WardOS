# Protected by .tamperward.yml (ci). This is the merge authority.
name: verify

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt · clippy · test · security-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pip install pyyaml
      # Issue #124: the bubblewrap-guarded namespace, verifier and egress tests must
      # RUN on the runner, never skip. Install bubblewrap and allow unprivileged user
      # namespaces, then FAIL the required job when the sandbox cannot actually be
      # created — a green check must never hide skipped security assertions.
      - name: Require working isolation (bubblewrap + unprivileged user namespaces)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          if bwrap --unshare-all --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind-try /lib64 /lib64 --proc /proc --dev /dev -- /bin/true; then
            echo "bwrap userns: OK"
          else
            echo "::error::bubblewrap cannot create a user namespace on this runner; the isolation tests would skip. Failing the required job per issue #124." >&2
            exit 1
          fi
      # WARD_REQUIRE_ISOLATION turns a missing isolation prerequisite from a silent
      # skip into a hard test failure (crates/ward-sandbox/src/ci.rs), so this merge
      # authority cannot pass with the namespace/verifier/egress assertions skipped.
      - name: Verify (isolation tests required to run, not skip — issue #124)
        env:
          WARD_REQUIRE_ISOLATION: "1"
        run: bash scripts/verify/tamperward.sh
      # Named, machine-checkable evidence that the mandatory isolation regressions
      # executed (issue #124). The e2e binary is already built by the step above, so
      # this only re-runs it (default libtest format: one `test <name> ... ok` line
      # each — no --nocapture, whose interleaving would corrupt those lines). The
      # checker holds an explicit inventory of the namespace, verifier-corpus and
      # egress test names, proves each ran exactly once with `ok`, ties the ST-029
      # corpus to its fixed row catalogue, and fails the required job — publishing
      # the names and counts to the step summary — if any evidence is missing.
      - name: Checker self-test (the gate can go red — issue #124)
        run: bash scripts/verify/check-isolation-evidence.test.sh
      - name: Isolation execution summary (issue #124)
        env:
          WARD_REQUIRE_ISOLATION: "1"
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/isolation.log"
          cargo test -p ward-daemon --test e2e --all-features > "$log" 2>&1 || {
            cat "$log"
            echo "::error::the e2e isolation suite did not pass under WARD_REQUIRE_ISOLATION" >&2
            exit 1
          }
          cat "$log"
          bash scripts/verify/check-isolation-evidence.sh "$log"

  deny:
    name: cargo-deny (advisories · licenses · sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans

  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/security-check/doc-links.py
      # One status source (ADR-0019): docs/status.toml and the README agree, and no other
      # document states a phase of its own.
      - run: python3 scripts/security-check/doc-status.py

  # The host image (image/) cannot be built or booted here; keep it lintable instead.
  image-lint:
    name: image lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: hadolint image/Containerfile
        run: |
          set -euo pipefail
          curl -fsSL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  hadolint" | sha256sum -c -
          chmod +x hadolint
          ./hadolint --config .hadolint.yaml image/Containerfile
      - name: shellcheck image/*.sh (and install.sh when present)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          files=(image/*.sh)
          if [[ -f install.sh ]]; then files+=(install.sh); fi
          bash -n "${files[@]}"
          shellcheck --severity=style "${files[@]}"
      - name: scripts explain themselves without podman or docker
        run: |
          ./image/build.sh --dry-run
          # The ONE dev escape hatch is a build-arg, not a disk-build --user (ADR-0027).
          ./image/build.sh --source checkout --dev-seed-user wardos --dry-run
          ./image/disk.sh --type qcow2 --dry-run
          ./image/disk.sh --type iso --dry-run
          ./image/disk.sh --type iso --luks --output /tmp/disk-ci --dry-run
          ./image/check-packages.sh --dry-run
          ./image/install-desktop.sh --help >/dev/null

  # Every name in image/packages.txt must be a package in the Fedora release the
  # Containerfile pins (docs/desktop.md §Packages); dnf answers from a fedora:<release>
  # container on the runner's docker.
  image-packages:
    name: image packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # When a name goes missing, `./image/check-packages.sh --discover NAME` (locally or
      # as a step here) lists the COPRs that carry it for the pinned release.
      - run: ./image/check-packages.sh

  # The desktop tree (docs/desktop.md): every script shellcheck-clean, every bash test green.
  desktop:
    name: desktop scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          # fuzzel powers E1 (fuzzel-config.test.sh): `fuzzel --check-config` on the shipped
          # config. It lives in the Ubuntu universe archive; install it best-effort so the check
          # RUNS here. If the archive lacks it the test self-skips (documenting the gap) rather
          # than faking a pass; on the image itself fuzzel 1.14 is present and the check is real.
          sudo apt-get install -y -q fuzzel || echo "fuzzel unavailable in the archive; E1 (fuzzel --check-config) will skip — run it on the image where fuzzel 1.14 ships"
      - run: bash desktop/tests/run.sh

  # The REAL cage + foot + wardos-provision-ui bootstrap boundary, run headlessly (#119
  # review item 4). greetd-session.test.sh MOCKS cage, so it cannot catch a protocol/session/
  # environment mismatch of the sort the T480s exposed (a layer-shell client aborting under
  # cage). This job runs the un-mocked boundary on Fedora — the same release the image ships
  # (image/Containerfile pins quay.io/fedora/fedora-bootc:44), with the real cage/foot/wlroots
  # and the real fuzzel 1.14 — so the smoke and the fuzzel config check are AUTHORITATIVE here,
  # not the self-skips they fall back to on a compositor-less/older-fuzzel runner. wlroots runs
  # on its headless backend, software-rendered (pixman), so no GPU/DRM is needed on the runner.
  desktop-compositor:
    name: desktop compositor smoke (Fedora)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      # actions/checkout needs git (and tar) present in this minimal Fedora container.
      - name: Install git for checkout
        run: dnf install -y --setopt=install_weak_deps=False git-core tar
      - uses: actions/checkout@v7
      # cage/foot/wlroots host the boundary; fuzzel 1.14 makes fuzzel-config.test.sh's
      # `--check-config` authoritative; a monospace font so foot can actually open a window;
      # socat is the broker transport the shipped UI uses (not reached in the smoke, installed
      # so the shipped client runs exactly as on the image). These are the versions the image
      # ships — the Fedora 44 repos here are the same the fedora-bootc:44 base resolves.
      - name: Install the shipped compositor stack (cage + foot + wlroots + fuzzel)
        run: dnf install -y --setopt=install_weak_deps=False cage foot fuzzel wlroots dejavu-sans-mono-fonts socat
      # The un-mocked integration smoke: cage (headless) hosting foot running the real
      # wardos-provision-ui, proving the first surface comes up and STAYS ALIVE, and that a
      # client which dies on startup is detected (the T480s failure class). This job EXPLICITLY
      # installs the compositor stack above, so WARDOS_SMOKE_REQUIRE=1 makes an environmental gap
      # (stack missing, or no headless surface) a FAILURE, not a skip — the required check cannot
      # go green without exercising the boundary (#119 review). The test prints named evidence
      # that Proof A, the negative control, and real-UI Proof B each executed and passed.
      - name: Cage + foot + wardos-provision-ui headless smoke (issue #119 item 4)
        env:
          WARDOS_SMOKE_REQUIRE: "1"
        run: bash desktop/tests/cage-smoke.test.sh
      # Secondary (owner note): validate the SHIPPED fuzzel config under the image's real
      # fuzzel 1.14 (`fuzzel --check-config`), not the Ubuntu 1.9.2 that self-skips in `desktop`.
      - name: fuzzel --check-config on the shipped config (Fedora 44 fuzzel 1.14)
        run: bash desktop/tests/fuzzel-config.test.sh

  # The release helpers (scripts/release): every script shellcheck-clean, every
  # bash regression green -- the tag/version/asset binding for issue #126.
  release-scripts:
    name: release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
      - run: bash scripts/release/run.sh

  # The Hyprland the image ships parses the shipped Hyprland tree (image/check-hyprland.sh):
  # a removed or renamed option shows up here, not in the booted desktop's error bar.
  hyprland-config:
    name: hyprland config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./image/check-hyprland.sh
