# Protected by .tamperward.yml (ci). This is the merge authority.
name: verify

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt · clippy · test · security-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pip install pyyaml
      # Let the bubblewrap-guarded isolation tests actually run on the runner.
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --unshare-all --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind-try /lib64 /lib64 --proc /proc --dev /dev -- /bin/true && echo "bwrap userns: OK" || echo "bwrap userns: unavailable (guarded tests will skip)"
      - run: bash scripts/verify/tamperward.sh

  deny:
    name: cargo-deny (advisories · licenses · sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans

  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/security-check/doc-links.py

  # The host image (image/) cannot be built or booted here; keep it lintable instead.
  image-lint:
    name: image lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint image/Containerfile
        run: |
          set -euo pipefail
          curl -fsSL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  hadolint" | sha256sum -c -
          chmod +x hadolint
          ./hadolint --config .hadolint.yaml image/Containerfile
      - name: shellcheck image/*.sh (and install.sh when present)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          files=(image/*.sh)
          if [[ -f install.sh ]]; then files+=(install.sh); fi
          bash -n "${files[@]}"
          shellcheck --severity=style "${files[@]}"
      - name: scripts explain themselves without podman
        run: |
          ./image/build.sh --dry-run
          ./image/disk.sh --type qcow2 --dry-run
          ./image/disk.sh --type iso --dry-run
