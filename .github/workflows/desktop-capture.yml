# The README's desktop, captured for real (issue #84, docs/desktop.md "The README
# animation"): the shipped Hyprland on a headless 1920x1080 output, software-rendered on
# a virtual DRM node, in the Fedora release the image pins, with Waybar, mako, fuzzel and
# foot from the image's package set and the ward binaries of this checkout.
# desktop/capture/capture.sh drives the scenes of desktop/capture/scenes.tsv through
# hyprctl dispatch and wardos-menu-select, takes one grim shot per scene, and assembles
# the GIF; the GIF and the shots are the artifact `wardos-desktop-capture`. Nothing here
# writes to the repository: desktop/capture/refresh.sh brings a run's GIF into assets/ by
# hand. Weekly on main, by hand (on a release tag too: `gh workflow run
# desktop-capture.yml --ref vX.Y.Z`), and on pull requests that touch what is on screen.
name: desktop capture

on:
  pull_request:
    paths:
      - "desktop/**"
      - "image/**"
      - "examples/ward-demo/**"
      - "assets/wardos-desktop.gif"
      - ".github/workflows/desktop-capture.yml"
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-capture-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The binaries on the runner, where the pinned toolchain and its cache already are; they
  # link only glibc, so they run unchanged in the newer Fedora container below.
  binaries:
    name: desktop capture binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-21)
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - run: cargo build --release --locked -p ward-cli -p ward-daemon -p ward-shell -p wardos-theme
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-capture-binaries
          path: |
            target/release/ward
            target/release/wardd
            target/release/ward-shell
            target/release/wardos-theme-render
          if-no-files-found: error
          retention-days: 1

  # No GPU on the runner. aquamarine allocates its buffers on a DRM node even for headless
  # outputs (a job container without /dev/dri dies in CBackend::create()), so the job runs
  # on the host, loads a virtual node (vgem's render node, else vkms), and hands it to the
  # Fedora container through --device. Inside, desktop/capture/ci-run.sh installs the
  # image's stack and runs capture.sh as an unprivileged user: Hyprland on headless
  # outputs (HYPRLAND_HEADLESS_ONLY=1), Mesa's software rasteriser for EGL and GBM. A
  # scene that does not come up fails the job with Hyprland's log; it cannot go green
  # without the shots.
  capture:
    name: desktop capture (Hyprland headless, Fedora)
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tried in order; the first that gives a DRM node is used.
      CAPTURE_DRM_MODULES: vgem vkms
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: desktop-capture-binaries
          path: capture-binaries
      - name: A virtual DRM node (vgem, else vkms)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" ||
            echo "linux-modules-extra-$(uname -r) not installed; trying the modules already present"
          shopt -s nullglob
          node=""
          for module in $CAPTURE_DRM_MODULES; do
            sudo modprobe "$module" || { echo "modprobe $module failed"; continue; }
            sudo udevadm settle || true
            if [[ $module == vgem ]]; then found=(/dev/dri/renderD*); else found=(/dev/dri/renderD* /dev/dri/card*); fi
            if [[ ${#found[@]} -gt 0 ]]; then
              node="${found[0]} ($module)"
              break
            fi
            echo "$module loaded but gave no usable node"
          done
          ls -l /dev/dri || true
          if [[ -z $node ]]; then
            echo "::error::no virtual DRM node: none of '$CAPTURE_DRM_MODULES' could be loaded or gave a node; Hyprland cannot allocate buffers without one" >&2
            exit 1
          fi
          # llvmpipe exports its buffers as dma-bufs through udmabuf where it exists.
          sudo modprobe udmabuf || echo "no udmabuf; Mesa falls back to shared memory"
          echo "DRM node for the capture: $node"
          { echo "DRM node for the capture: \`$node\`"; echo; } >>"$GITHUB_STEP_SUMMARY"
      # The Fedora release the image pins (image/Containerfile's FROM line), as root with
      # the node; ci-run.sh hands capture-out back to this user, failed or not.
      - name: Capture
        run: |
          set -euo pipefail
          release=$(sed -n 's|^FROM quay.io/fedora/fedora-bootc:\([0-9][0-9]*\)$|\1|p' image/Containerfile | head -n 1)
          [[ $release =~ ^[0-9]+$ ]] || { echo "::error::no fedora-bootc:<release> FROM line in image/Containerfile" >&2; exit 1; }
          devices=(--device /dev/dri)
          if [[ -e /dev/udmabuf ]]; then devices+=(--device /dev/udmabuf); fi
          docker run --rm "${devices[@]}" -v "$PWD:/w" -w /w \
            -e GITHUB_ACTIONS -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "fedora:$release" bash desktop/capture/ci-run.sh /w/capture-binaries /w/capture-out
      - name: Summary
        if: always()
        run: if [[ -f capture-out/summary.md ]]; then cat capture-out/summary.md >>"$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: wardos-desktop-capture
          path: |
            capture-out/wardos-desktop.gif
            capture-out/frames/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: wardos-desktop-capture-logs
          path: capture-out/
          retention-days: 14
