# Release: build the Linux binaries for x86_64 and aarch64, each natively on a runner
# of that architecture (no cross toolchain), package them with the installer, and
# attach both tarballs and their checksums to one GitHub release. Runs on a v* tag
# push, or by hand with a version (then the workflow creates the tag on the chosen ref).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        # The dispatch input (or the pushed ref) reaches Bash through an env
        # value, never spliced into the script text: the runner expands `${{ }}`
        # into the shell program before Bash parses it, so a metacharacter-bearing
        # dispatch value would otherwise alter a job that holds `contents: write`.
        # Read as data from $TAG_INPUT, then gate on the strict tag grammar.
        env:
          TAG_INPUT: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG_INPUT"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "not a valid v<semver> tag: '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      # The tag must name exactly the workspace version of the source it is cut from.
      # A mistyped version, or a dispatch from a ref whose Cargo.toml disagrees, is
      # rejected here -- before any build runs (build `needs: version`) or any asset
      # is published.
      - name: Tag matches the workspace version
        # The resolved tag reaches check-version.sh as an env value it validates,
        # not via `${{ }}` splicing into the script.
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/release/check-version.sh "$TAG"

  # One job per architecture, on a runner of that architecture: the binaries are built
  # and smoke-tested natively, and the tarball name carries `uname -m` of the machine
  # they run on (install.sh and the image's release stage pick the tarball by it).
  build:
    name: ${{ matrix.arch }}-unknown-linux-gnu
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: The runner is the architecture it claims
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$ARCH"
      - name: Build
        run: cargo build --release --locked -p ward-cli -p ward-daemon -p ward-agent -p ward-shell -p wardos-theme
      - name: Package
        run: |
          set -euo pipefail
          name="wardos-${VERSION}-${ARCH}-linux"
          mkdir -p "dist/${name}"
          # The image's release stage expects these five (image/Containerfile); tarballs
          # before v0.2 carried only the first three.
          cp target/release/ward target/release/wardd target/release/ward-agent \
             target/release/ward-shell target/release/wardos-theme-render "dist/${name}/"
          cp install.sh README.md LICENSE "dist/${name}/"
          cp -r docs "dist/${name}/docs"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -la dist
      - name: Smoke the packaged binaries
        run: |
          set -euo pipefail
          dir="dist/wardos-${VERSION}-${ARCH}-linux"
          # The compiled binary must report the version this release is labelled with.
          # A tarball whose `ward` was built from other source is rejected here, before
          # the artifact is uploaded (upload-artifact runs after this step).
          bash scripts/release/check-binary-version.sh "$VERSION" "${dir}/ward"
          "${dir}/wardd" --help >/dev/null
          "${dir}/ward-agent" --help >/dev/null
          "${dir}/ward-shell" --help >/dev/null
          "${dir}/wardos-theme-render" --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: wardos-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # One job creates the release and attaches every tarball, so the two builds never
  # race on `gh release create`. It runs as long as the version resolved and nothing
  # was cancelled: an aarch64 build that fails must not lose the x86_64 release (the
  # red matrix job says what is missing), but a missing x86_64 tarball is fatal.
  release:
    name: release
    needs: [version, build]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wardos-*
          path: dist
          merge-multiple: true
      - name: What was built
        id: built
        run: |
          set -euo pipefail
          ls -la dist
          test -f "dist/wardos-${VERSION}-x86_64-linux.tar.gz"
          arch=x86_64
          if [[ -f "dist/wardos-${VERSION}-aarch64-linux.tar.gz" ]]; then arch=both; fi
          echo "disk_arch=$arch" >> "$GITHUB_OUTPUT"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # An existing tag must already resolve to this build's commit. Otherwise a
            # rerun from a different ref would clobber assets under an unrelated release
            # and label them as source they were not built from -- reject that instead.
            obj_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
            obj_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type')"
            if [[ "$obj_type" == "tag" ]]; then
              obj_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${obj_sha}" --jq '.object.sha')"
            fi
            if [[ "$obj_sha" != "$GITHUB_SHA" ]]; then
              echo "refusing to publish: tag $TAG points at $obj_sha, not the build commit $GITHUB_SHA" >&2
              exit 1
            fi
            # Same tag, same commit: an idempotent retry. Before clobbering, pull
            # the already-published tarballs and their .sha256 checksums and compare
            # them byte-for-byte with what this run rebuilt. A rebuild at the same
            # commit must reproduce the published bytes exactly: identical assets are
            # a no-op (skip the upload), differing bytes are refused before anything
            # is overwritten.
            #
            # download-published.sh enumerates the release's real assets and pulls
            # exactly the expected ones, failing the job on any auth/API/network/
            # download error. Inability to READ the existing release must never look
            # like "no assets exist" and authorize a clobber -- so its non-zero exit
            # fails this step here, before check-assets could ever say "upload".
            mkdir -p published
            bash scripts/release/download-published.sh "$TAG" dist published
            rc=0
            bash scripts/release/check-assets.sh dist published || rc=$?
            case "$rc" in
              0)  echo "published assets are byte-identical; nothing to upload." ;;
              10) gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber ;;
              *)  echo "refusing to overwrite the published release; see check-assets output above." >&2
                  exit 1 ;;
            esac
          else
            # --target binds the new tag to this build's commit; the .sha256 assets
            # record each tarball's checksum alongside it.
            gh release create "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 \
              --target "$GITHUB_SHA" --title "WardOS $TAG" --generate-notes
          fi
      # The disks for this release, for every architecture that has a tarball. A
      # release created with the workflow's own token does not fire other workflows'
      # `release:` triggers (GitHub's rule for GITHUB_TOKEN events, workflow_dispatch
      # excepted), so the disk workflow is dispatched here, once, and attaches the
      # qcow2 and ISO of each architecture to the release itself.
      - name: Build and attach the disks
        env:
          GH_TOKEN: ${{ github.token }}
          DISK_ARCH: ${{ steps.built.outputs.disk_arch }}
        run: |
          set -euo pipefail
          # No `-f user=...` here on purpose: per ADR-0027 (#119) a production
          # release disk ships UNPROVISIONED. The disk workflow's blank `user`
          # default leaves no account, and the real user is created at first
          # boot -- requesting the `wardos` dev-seed account would ship a
          # pre-provisioned login on every published disk. guard-release-dispatch
          # fails the job if a non-blank user field ever slips back in.
          args=(disk.yml --ref "$GITHUB_REF_NAME"
                -f type=both -f source=release -f "release=$TAG"
                -f "arch=$DISK_ARCH" -f luks=false)
          bash scripts/release/guard-release-dispatch.sh "${args[@]}"
          gh workflow run "${args[@]}"
